<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AAYSSA Member Portal</title>

  <script>
    if (new URLSearchParams(window.location.search).get("embed") === "1") {
      document.documentElement.classList.add("portal-embedded");
    }
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f3;
      color: #222;
    }

    .portal-embedded .site-header {
      display: none;
    }

    .portal-embedded .portal-heading {
      padding: 34px 20px 26px;
    }

    .portal-embedded .portal-heading h1 {
      font-size: clamp(34px, 6vw, 48px);
    }

    .portal-embedded .heading-divider {
      margin: 22px auto 18px;
    }

    .portal-embedded .page {
      padding-top: 26px;
      padding-bottom: 28px;
    }


    /* =====================================================
       AAYSSA WEBSITE HEADER
       ===================================================== */

    .site-header {
      width: 100%;
      background: #151515;
    }

    .site-header-inner {
      max-width: 2048px;
      min-height: 235px;
      margin: 0 auto;
      padding: 24px 100px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo-link {
      display: block;
      text-decoration: none;
    }

    .site-logo {
      width: 170px;
      height: 170px;
      object-fit: contain;
      display: block;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: clamp(24px, 3vw, 52px);
      margin-left: auto;
    }

    .site-nav a {
      color: #e5e3e3;
      text-decoration: none;
      font-size: 18px;
      letter-spacing: 1.7px;
      font-weight: 400;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .site-nav a:hover {
      color: #fff;
    }

    .site-nav .active {
      color: #fff;
      font-weight: 700;
    }

    .nav-with-chevron::after {
      content: "";
      display: inline-block;
      width: 0;
      height: 0;
      margin-left: 9px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid currentColor;
      vertical-align: 2px;
    }

    .mobile-menu-button {
      display: none;
      background: transparent;
      border: 0;
      color: white;
      font-size: 30px;
      cursor: pointer;
      padding: 8px;
    }


    /* =====================================================
       PORTAL HEADING
       ===================================================== */

    .portal-heading {
      text-align: center;
      padding: 70px 20px 38px;
      background: white;
    }

    .portal-heading h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #111;
    }

    .heading-divider {
      width: 62px;
      height: 2px;
      background: #ddd;
      margin: 34px auto 28px;
    }

    .mantra {
      color: #b56800;
      font-size: 20px;
      font-weight: 700;
    }


    /* =====================================================
       MAIN PAGE
       ===================================================== */

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 38px 18px 55px;
    }

    .portal-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .welcome {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 400;
      margin-bottom: 0;
    }

    .portal-shell {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .portal-sidebar {
      position: sticky;
      top: 18px;
      padding: 12px;
      border: 1px solid #e2dbd1;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .045);
    }

    .portal-sidebar-title {
      padding: 8px 10px 11px;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .portal-nav-button,
    .portal-nav-link {
      display: block;
      width: 100%;
      margin: 2px 0;
      padding: 11px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #4d4034;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }

    .portal-nav-button:hover,
    .portal-nav-link:hover {
      background: #fff5e3;
      color: #7b420d;
    }

    .portal-nav-button.active {
      background: #8a3f12;
      color: #fff;
    }

    .portal-mobile-selector {
      display: none;
      width: 100%;
      margin-bottom: 16px;
      padding: 11px 12px;
      border: 1px solid #b97716;
      border-radius: 9px;
      background: #fffaf2;
      color: #5b3510;
      font: inherit;
      font-weight: 700;
    }

    .portal-mobile-feedback {
      display: none;
      margin: -6px 0 16px;
      padding: 10px 12px;
      border: 1px solid #d9bd83;
      border-radius: 9px;
      background: #fff8ec;
      color: #713d0d;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .portal-panel[hidden] {
      display: none;
    }

    .portal-panel-title {
      margin: 0 0 16px;
      color: #6f3a0b;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
    }


    /* =====================================================
       MEMBER CARDS
       ===================================================== */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .grid > .section-card.full-width {
      grid-column: 1 / -1;
    }

    .portal-panel > .grid > .section-card:only-child {
      grid-column: 1 / -1;
    }

    .section-card,
    .dashboard-card,
    .trend-card,
    .directory-card {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .section-card h2,
    .dashboard-card h3,
    .trend-card h3,
    .directory-card h3 {
      margin: 0 0 16px;
      color: #8b5100;
    }

    .section-card h2 {
      font-size: 18px;
    }

    .info-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      display: block;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 15px;
      overflow-wrap: anywhere;
    }


    /* =====================================================
       CHIPS
       ===================================================== */

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .chip {
      background: #f4eadb;
      color: #754200;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
    }


    /* =====================================================
       VOLUNTEERING
       ===================================================== */

    .section-heading-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-heading-row h2 {
      margin: 0;
    }

    .small-action-button,
    .secondary-button,
    .danger-button {
      border: none;
      border-radius: 7px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .small-action-button {
      background: #b96c00;
      color: white;
    }

    .secondary-button {
      background: #333;
      color: white;
    }

    .danger-button {
      background: #f7e8e8;
      color: #9b2424;
    }

    .volunteer-entry {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .volunteer-entry:last-child {
      border-bottom: none;
    }

    .volunteer-name {
      font-weight: 800;
      color: #333;
    }

    .volunteer-type {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .volunteer-form {
      display: grid;
      gap: 18px;
    }

    .volunteer-form-row {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 15px;
      background: #fffdf9;
    }

    .volunteer-form-title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .form-field {
      display: grid;
      gap: 5px;
      margin-top: 10px;
    }

    .form-field label,
    .checkbox-label {
      color: #555;
      font-size: 13px;
      font-weight: 700;
    }

    .field-help {
      color: #777;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }

    .form-field input[type="text"],
    .form-field input[type="tel"],
    .form-field input[type="date"],
    .form-field input[type="email"],
    .form-field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      font-size: 14px;
    }

    .form-field input[type="number"],
    .form-field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .form-field textarea {
      min-height: 88px;
      resize: vertical;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .checkbox-label[hidden] {
      display: none;
    }

    .area-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 9px;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }


    /* =====================================================
       MAALADHARAN REGISTRATION
       ===================================================== */

    .maaladharan-card {
      grid-column: 1 / -1;
    }

    .maaladharan-intro {
      margin: -4px 0 18px;
      color: #555;
      line-height: 1.55;
    }

    .maaladharan-schedule {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .maaladharan-date {
      padding: 14px;
      border: 1px solid #ead8bb;
      border-radius: 10px;
      background: #fff8ec;
    }

    .maaladharan-date strong {
      display: block;
      color: #8b5100;
      margin-bottom: 4px;
    }

    .registered-swamies-panel {
      margin-bottom: 22px;
      padding: 16px;
      border: 1px solid #d5e7da;
      border-radius: 10px;
      background: #f0f7f2;
    }

    .registered-swamies-panel .label {
      color: #26783c;
      margin-bottom: 8px;
    }

    .pooja-calendar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 12px 0;
      font-size: 13px;
    }

    .pooja-calendar-legend span::before {
      content: "";
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 5px;
      border-radius: 3px;
      vertical-align: -1px;
      background: var(--calendar-color);
    }

    .pooja-calendar-months {
      margin: 16px 0 24px;
    }

    .pooja-calendar-navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .pooja-calendar-navigation button {
      min-width: 92px;
      padding: 8px 12px;
      border: 1px solid #b97716;
      border-radius: 8px;
      background: #fffaf2;
      color: #774500;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .pooja-calendar-navigation button:disabled {
      border-color: #d8d3cc;
      color: #aaa49c;
      cursor: not-allowed;
    }

    .pooja-calendar-navigation strong {
      color: #5b3510;
      text-align: center;
    }

    .pooja-calendar-month {
      padding: 14px;
      border: 1px solid #e3ded4;
      border-radius: 12px;
      background: #fff;
      overflow-x: auto;
    }

    .pooja-calendar-month h3 {
      margin: 0 0 12px;
      text-align: center;
      color: #5b3510;
    }

    .pooja-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      min-width: 700px;
    }

    .pooja-calendar-weekday {
      padding-bottom: 4px;
      color: #716b63;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .pooja-calendar-day {
      min-height: 45px;
      padding: 5px 3px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: #aaa49c;
      font-size: 12px;
      text-align: center;
    }

    .pooja-calendar-day strong,
    .pooja-calendar-day small {
      display: block;
    }

    .pooja-calendar-day small {
      margin-top: 3px;
      font-size: 9px;
      line-height: 1.15;
    }

    .pooja-calendar-day.available {
      border-color: #b9dbc3;
      background: #e9f6ed;
      color: #1f6834;
    }

    .pooja-calendar-day.booked {
      min-height: 105px;
      border-color: #e3b95e;
      background: #fff0c9;
      color: #704300;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .pooja-calendar-booking-address {
      font-weight: 500;
    }

    .pooja-calendar-day.blocked {
      border-color: #d5d1cc;
      background: #ece9e5;
      color: #6f6962;
    }

    .pooja-calendar-unblock {
      margin-top: 4px;
      padding: 3px 5px;
      border: 1px solid #8b4f16;
      border-radius: 5px;
      background: #fff;
      color: #713d0d;
      font: inherit;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .pooja-calendar-admin-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      margin-top: 5px;
    }

    .pooja-calendar-admin-actions button {
      padding: 3px 5px;
      border: 1px solid #8b4f16;
      border-radius: 5px;
      background: #fff;
      color: #713d0d;
      font: inherit;
      font-size: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .home-pooja-block-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .home-pooja-admin-dropdown {
      margin-top: 18px;
      border: 1px solid #ded7cd;
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
    }

    .home-pooja-admin-dropdown summary {
      padding: 14px 16px;
      background: #fff8ec;
      color: #713d0d;
      font-weight: 700;
      cursor: pointer;
      list-style-position: inside;
    }

    .home-pooja-admin-dropdown[open] summary {
      border-bottom: 1px solid #ead8bb;
    }

    .home-pooja-admin-dropdown-content {
      padding: 16px;
    }

    .rsvp-groups {
      display: grid;
      gap: 16px;
    }

    .rsvp-event-card {
      overflow: hidden;
      border: 1px solid #e4ddd3;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(82, 49, 18, 0.06);
    }

    .rsvp-event-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 18px;
      border-bottom: 1px solid #eadfce;
      background: #fffaf2;
    }

    .rsvp-event-title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .rsvp-event-title strong {
      color: #4f2e12;
      font-size: 18px;
      line-height: 1.3;
    }

    .rsvp-event-title span {
      color: #6f6256;
      line-height: 1.4;
    }

    .rsvp-summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .rsvp-summary-item {
      min-width: 118px;
      padding: 8px 10px;
      border: 1px solid #e4d4bb;
      border-radius: 8px;
      background: #fff;
      color: #5d5044;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    .rsvp-summary-item strong {
      display: block;
      margin-bottom: 2px;
      color: #713d0d;
      font-size: 13px;
    }

    .rsvp-table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .rsvp-table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
    }

    .rsvp-table th,
    .rsvp-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #eee8df;
      text-align: left;
      vertical-align: top;
    }

    .rsvp-table th {
      background: #f8f4ee;
      color: #5b4634;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .rsvp-table td {
      color: #302a25;
      line-height: 1.4;
    }

    .rsvp-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .rsvp-table tbody tr:hover {
      background: #fffaf3;
    }

    .rsvp-contact {
      overflow-wrap: anywhere;
    }

    .rsvp-status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e8f4eb;
      color: #25633a;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .rsvp-empty-value {
      color: #9a9087;
    }

    @media (max-width: 760px) {
      .home-pooja-admin-dropdown-content {
        padding: 12px;
      }

      .rsvp-event-header {
        flex-direction: column;
      }

      .rsvp-summary {
        justify-content: flex-start;
        width: 100%;
      }

      .rsvp-summary-item {
        flex: 1 1 130px;
      }
    }

    .home-pooja-block-edit-form,
    .home-pooja-booking-edit-form,
    .home-pooja-availability-edit-form {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #e3ded4;
      border-radius: 8px;
      background: #fffaf3;
    }

    .home-pooja-block-edit-form[hidden],
    .home-pooja-booking-edit-form[hidden],
    .home-pooja-availability-edit-form[hidden] {
      display: none;
    }

    .home-pooja-invitation-builder {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #d9bd83;
      border-radius: 12px;
      background: #fffaf0;
    }

    .home-pooja-invitation-builder[hidden] {
      display: none;
    }

    .home-pooja-invitation-preview {
      position: relative;
      isolation: isolate;
      width: min(100%, 640px);
      min-height: 800px;
      margin: 16px auto 0;
      padding: 30px 30px 24px;
      overflow: hidden;
      border: 2px solid #c79736;
      border-radius: 14px;
      --invitation-overlay: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.1),
        rgba(0, 0, 0, 0.02) 38%,
        rgba(0, 0, 0, 0.72) 72%,
        rgba(0, 0, 0, 0.34)
      );
      background-color: #050505;
      background-image: url("/invitation-gold-background.png");
      background-position: center;
      background-size: cover;
      box-shadow: 0 14px 34px rgba(24, 12, 0, 0.3);
      color: #fff7da;
      text-align: center;
    }

    .home-pooja-invitation-preview::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--invitation-overlay);
      content: "";
      pointer-events: none;
    }

    .home-pooja-invitation-preview[data-invitation-theme="maroon"] {
      --invitation-overlay: linear-gradient(
        180deg,
        rgba(74, 4, 20, 0.25),
        rgba(62, 3, 18, 0.18) 38%,
        rgba(43, 0, 12, 0.86) 72%,
        rgba(58, 2, 18, 0.62)
      );
      background-color: #3c0715;
      background-blend-mode: screen;
    }

    .home-pooja-invitation-preview[data-invitation-theme="blue"] {
      --invitation-overlay: linear-gradient(
        180deg,
        rgba(4, 20, 72, 0.26),
        rgba(2, 13, 56, 0.2) 38%,
        rgba(0, 8, 38, 0.88) 72%,
        rgba(2, 16, 58, 0.65)
      );
      background-color: #071b4d;
      background-blend-mode: screen;
    }

    .home-pooja-invitation-preview[data-invitation-theme="purple"] {
      --invitation-overlay: linear-gradient(
        180deg,
        rgba(53, 9, 70, 0.25),
        rgba(41, 4, 58, 0.2) 38%,
        rgba(29, 0, 40, 0.88) 72%,
        rgba(46, 4, 62, 0.66)
      );
      background-color: #321044;
      background-blend-mode: screen;
    }

    .home-pooja-invitation-preview[data-invitation-theme="green"] {
      --invitation-overlay: linear-gradient(
        180deg,
        rgba(4, 55, 38, 0.24),
        rgba(2, 43, 29, 0.2) 38%,
        rgba(0, 29, 19, 0.88) 72%,
        rgba(3, 49, 33, 0.64)
      );
      background-color: #083d2c;
      background-blend-mode: screen;
    }

    .invitation-deity-row {
      display: grid;
      grid-template-columns: 82px minmax(110px, 150px) 82px;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-height: 112px;
    }

    .invitation-deity-row img {
      display: block;
      width: 100%;
      max-height: 108px;
      object-fit: contain;
    }

    .invitation-deity-row .invitation-logo {
      max-height: 126px;
      filter: drop-shadow(0 3px 7px rgba(255, 194, 64, 0.35));
    }

    .invitation-ayyappa {
      display: block;
      width: auto;
      max-width: 54%;
      height: 290px;
      margin: 10px auto 16px;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 0 15px rgba(255, 217, 111, 0.45));
    }

    .home-pooja-invitation-preview h3 {
      margin: 5px 0 12px;
      color: #fff4bd;
      font-family: Georgia, serif;
      font-size: clamp(25px, 5vw, 36px);
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.2;
      text-shadow: 0 0 9px rgba(255, 219, 117, 0.75);
      text-transform: uppercase;
    }

    .home-pooja-invitation-preview strong,
    .home-pooja-invitation-preview span {
      display: block;
    }

    .invitation-blessing,
    .invitation-welcome,
    .invitation-closing {
      color: #f8e9bd;
      font-family: Georgia, serif;
    }

    .invitation-event-name {
      margin: 8px 0;
      color: #ffe9a0;
      font-family: Georgia, serif;
      font-size: 21px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .home-pooja-invitation-preview .invitation-host {
      margin: 10px 0;
      color: #fff4bd;
      font-family: Georgia, serif;
      font-size: 20px;
      letter-spacing: 0.04em;
    }

    .invitation-detail {
      margin: 6px 0;
      color: #fff7da;
      font-size: 17px;
      letter-spacing: 0.03em;
    }

    .home-pooja-invitation-preview .invitation-address {
      margin: 8px 0 14px;
      white-space: pre-line;
    }

    .invitation-footer {
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid rgba(236, 197, 91, 0.55);
      color: #f8e9bd;
      font-family: Georgia, serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .invitation-footer a {
      color: #ffe9a0;
      text-decoration: none;
    }

    @media (max-width: 620px) {
      .home-pooja-invitation-preview {
        min-height: 720px;
        padding: 22px 18px 20px;
      }

      .invitation-deity-row {
        grid-template-columns: 62px minmax(90px, 120px) 62px;
        gap: 10px;
      }

      .invitation-ayyappa {
        width: auto;
        max-width: 68%;
        height: 245px;
      }
    }

    .home-pooja-invitation-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .maaladharan-registration {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .maaladharan-registration-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .maaladharan-registration-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .withdrawn-badge {
      background: #777;
    }

    .maaladharan-edit-form {
      margin-top: 12px;
      padding: 15px;
      border: 1px solid #ead8bb;
      border-radius: 10px;
      background: #fffdf9;
    }

    .maaladharan-registration:last-child {
      border-bottom: 0;
    }

    .maaladharan-registration-meta {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }

    .maaladharan-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 16px;
      padding-top: 4px;
    }

    .maaladharan-form .full-width {
      grid-column: 1 / -1;
    }

    .maaladharan-form .form-actions {
      margin-top: 14px;
    }

    .maaladharan-required-marker {
      color: #b3261e;
      font-weight: 800;
    }

    .maaladharan-required-note {
      grid-column: 1 / -1;
      margin: 0 0 8px;
      color: #666;
      font-size: 12px;
    }

    .maaladharan-whatsapp-invite {
      margin: 16px 0;
      padding: 14px 16px;
      border: 1px solid #b9d9c1;
      border-radius: 10px;
      background: #f0faf2;
      color: #245f34;
    }

    .maaladharan-whatsapp-invite a {
      color: #176b30;
      font-weight: 800;
    }

    .inline-message {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .maaladharan-schedule,
      .maaladharan-form {
        grid-template-columns: 1fr;
      }

      .maaladharan-form .full-width {
        grid-column: auto;
      }
    }


    /* =====================================================
       COMMUNICATION PREFERENCES
       ===================================================== */

    .preference {
      display: inline-block;
      margin-right: 12px;
      margin-bottom: 8px;
      padding: 7px 11px;
      border-radius: 8px;
      background: #f4f4f4;
      font-size: 13px;
      font-weight: 700;
    }

    .preference-on {
      background: #e6f4e9;
      color: #26783c;
    }

    .preference-off {
      color: #777;
    }


    /* =====================================================
       DONATIONS
       ===================================================== */

    .donation-summary {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fffdf9;
      margin-bottom: 14px;
    }

    .donation-total {
      font-size: 30px;
      font-weight: 800;
      color: #8b5100;
      margin-top: 4px;
    }

    .donation-meta {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .donation-payment {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .donation-payment:last-child {
      border-bottom: none;
    }

    .donation-payment-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .donation-description {
      font-weight: 800;
      color: #333;
    }

    .donation-date {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .donation-amount {
      color: #8b5100;
      font-weight: 800;
      white-space: nowrap;
    }

    .receipt-link {
      display: inline-block;
      margin-top: 9px;
      padding: 8px 11px;
      border-radius: 7px;
      background: #333;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .donate-button {
      display: inline-block;
      padding: 9px 13px;
      border-radius: 7px;
      background: #b96c00;
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .donate-button:hover {
      background: #995900;
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .edit-button,
    .logout-button,
    .login-button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 7px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    .edit-button,
    .login-button {
      background: #b96c00;
      color: white;
    }

    .edit-button:hover,
    .login-button:hover {
      background: #995900;
    }

    .logout-button {
      background: #333;
      color: white;
    }

    .logout-button:hover {
      background: #111;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* =====================================================
       LOADING / MESSAGES
       ===================================================== */

    .loading,
    .message,
    .dashboard-loading {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .error {
      color: #a32929;
    }


    /* =====================================================
       ROLE BADGES
       ===================================================== */

    .admin-badge,
    .board-badge,
    .role-badge,
    .status-badge {
      display: inline-block;
      color: white;
      padding: 5px 10px;
      border-radius: 999px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      vertical-align: middle;
    }

    .admin-badge,
    .role-badge {
      background: #8b5100;
    }

    .board-badge {
      background: #555;
    }

    .status-badge {
      background: #26783c;
    }


    /* =====================================================
       DASHBOARD
       ===================================================== */

    .dashboard {
      margin-top: 38px;
      padding-top: 34px;
      border-top: 1px solid #ddd7ce;
    }

    .dashboard-header {
      margin-bottom: 20px;
    }

    .dashboard-header h2 {
      margin: 0 0 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-weight: 400;
      color: #111;
    }

    .dashboard-header p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      color: #8b5100;
      white-space: nowrap;
    }

    .stat-label {
      margin-top: 6px;
      font-size: 11px;
      color: #777;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.4;
      min-height: 31px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .admin-dashboard-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      padding: 6px;
      background: #f4eee5;
      border: 1px solid #e4d8c8;
      border-radius: 12px;
    }

    .admin-dashboard-tab {
      flex: 1 1 150px;
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      background: transparent;
      color: #684018;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .admin-dashboard-tab:hover {
      background: #fffaf2;
    }

    .admin-dashboard-tab[aria-selected="true"] {
      background: #8b5100;
      color: white;
      box-shadow: 0 2px 8px rgba(93, 53, 8, 0.2);
    }

    .admin-dashboard-panel[hidden] {
      display: none;
    }

    .capacity-monitor-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .capacity-monitor-header h3 {
      margin: 0 0 4px;
    }

    .capacity-monitor-header p {
      margin: 0;
      color: #6f655a;
      font-size: 14px;
    }

    .capacity-refresh {
      width: auto;
      margin: 0;
      padding: 9px 16px;
    }

    .capacity-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid #d8e8dc;
      border-radius: 10px;
      background: #f0faf2;
      color: #285d34;
      font-weight: 700;
    }

    .capacity-summary.warning {
      border-color: #efd69d;
      background: #fff8e6;
      color: #7a5300;
    }

    .capacity-summary.critical {
      border-color: #efb4b4;
      background: #fff0f0;
      color: #8b1e1e;
    }

    .capacity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .capacity-card {
      padding: 16px;
      border: 1px solid #e5ddd3;
      border-radius: 12px;
      background: #fff;
    }

    .capacity-card.warning {
      border-color: #e8c675;
      background: #fffbef;
    }

    .capacity-card.critical,
    .capacity-card.error {
      border-color: #e4a3a3;
      background: #fff5f5;
    }

    .capacity-card.manual {
      border-color: #b7cbe2;
      background: #f5f9fd;
    }

    .capacity-card-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .capacity-card-heading strong {
      display: block;
      color: #372414;
    }

    .capacity-card-heading small {
      color: #796f66;
    }

    .capacity-status {
      padding: 4px 8px;
      border-radius: 999px;
      background: #e7f5ea;
      color: #246134;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .capacity-card.warning .capacity-status {
      background: #ffe9ad;
      color: #795100;
    }

    .capacity-card.critical .capacity-status,
    .capacity-card.error .capacity-status {
      background: #ffd5d5;
      color: #8d2020;
    }

    .capacity-card.manual .capacity-status {
      background: #dceaf7;
      color: #315d85;
    }

    .capacity-progress {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #ece7e1;
    }

    .capacity-progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: #399451;
    }

    .capacity-card.warning .capacity-progress span {
      background: #d49b13;
    }

    .capacity-card.critical .capacity-progress span {
      background: #c83d3d;
    }

    .capacity-usage {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: #5f554c;
      font-size: 13px;
    }

    .capacity-detail {
      margin: 8px 0 0;
      color: #665d55;
      font-size: 13px;
      line-height: 1.45;
    }

    .capacity-note {
      margin: 16px 0 0;
      color: #776b60;
      font-size: 13px;
    }

    .maaladharan-report-stack {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
    }

    .maaladharan-report-stack > .trend-card {
      width: 100%;
      margin-top: 0;
    }

    .dashboard-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .dashboard-row:last-child {
      border-bottom: none;
    }

    .dashboard-number {
      font-weight: 800;
      color: #8b5100;
    }


    /* =====================================================
       REGISTRATION TREND
       ===================================================== */

    .trend-card {
      margin-top: 20px;
    }

    .maaladharan-dashboard-grid {
      align-items: stretch;
    }

    .maaladharan-dashboard-grid .trend-card {
      min-width: 0;
      margin-top: 0;
    }

    .maaladharan-dashboard-grid > .full-width {
      grid-column: 1 / -1;
    }

    .registered-swamies-table .overall-total-row td {
      background: #fff3dc;
      color: #5f2b10;
      font-weight: 800;
    }

    .dashboard-trend-grid .trend-card {
      min-width: 0;
      margin-top: 0;
    }

    .dashboard-trend-grid .trend-chart {
      min-width: 0;
    }

    .dashboard-trend-grid .trend-column {
      min-width: 0;
    }

    .registered-swamies-list {
      max-height: 340px;
      overflow-x: auto;
      overflow-y: auto;
    }

    .registered-swamies-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .registered-swamies-table th,
    .registered-swamies-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
      white-space: nowrap;
    }

    .registered-swamies-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fffaf3;
    }

    .swamy-sort-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #5f2b10;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .swamy-sort-button:hover,
    .swamy-sort-button:focus-visible {
      text-decoration: underline;
    }

    .trend-subtitle,
    .directory-subtitle {
      color: #777;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 22px;
    }

    .trend-chart-scroll {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .trend-chart {
      min-width: 700px;
      height: 300px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border-bottom: 2px solid #ddd;
      padding: 30px 10px 0;
    }

    .trend-column {
      flex: 1;
      min-width: 44px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .trend-count {
      min-height: 20px;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 800;
      color: #8b5100;
    }

    .trend-bar-area {
      width: 100%;
      height: 210px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .trend-bar {
      width: 65%;
      max-width: 48px;
      min-width: 16px;
      background: linear-gradient(
        180deg,
        #c77a10,
        #8b5100
      );
      border-radius: 7px 7px 0 0;
      min-height: 3px;
    }

    .trend-label {
      min-height: 35px;
      margin-top: 8px;
      color: #666;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      white-space: nowrap;
    }


    /* =====================================================
       MEMBER DIRECTORY
       ===================================================== */

    .directory-card {
      margin-top: 20px;
    }

    .directory-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .directory-search {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }

    .directory-search:focus {
      border-color: #b96c00;
      box-shadow: 0 0 0 2px rgba(185, 108, 0, 0.12);
    }

    .directory-sort {
      min-width: 190px;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      background: white;
      outline: none;
    }

    .directory-sort:focus {
      border-color: #b96c00;
      box-shadow: 0 0 0 2px rgba(185, 108, 0, 0.12);
    }

    .directory-search-button {
      border: none;
      background: #b96c00;
      color: white;
      padding: 12px 20px;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
    }

    .directory-search-button:hover {
      background: #995900;
    }

    .directory-results {
      display: grid;
      gap: 14px;
    }

    .member-card {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 18px;
      background: #fffdf9;
    }

    .member-card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .member-name {
      font-size: 17px;
      font-weight: 800;
      color: #333;
    }

    .member-meta {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    .member-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 20px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .page-button {
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      background: #333;
      color: white;
      font-weight: 700;
    }

    .page-info {
      color: #666;
      font-size: 13px;
      font-weight: 700;
    }

    .directory-empty {
      text-align: center;
      padding: 25px;
      color: #777;
      background: #fafafa;
      border-radius: 10px;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      text-align: center;
      margin-top: 42px;
      padding-top: 22px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      color: #777;
    }


    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 1000px) {

      .site-header-inner {
        padding-left: 30px;
        padding-right: 30px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 1320px) {
      .site-header-inner {
        min-height: auto;
        padding: 16px 30px;
        flex-wrap: wrap;
      }

      .site-logo {
        width: 100px;
        height: 100px;
      }

      .mobile-menu-button {
        display: block;
      }

      .site-nav {
        display: none;

<script>

  let directoryCurrentPage = 1;
  let directorySearchQuery = "";
  let directorySortBy = "primaryName";


  /* =====================================================
     MOBILE MENU
     ===================================================== */

  const mobileMenuButton =
    document.getElementById(
      "mobileMenuButton"
    );


  const siteNav =
    document.getElementById(
      "siteNav"
    );


  mobileMenuButton.addEventListener(
    "click",
    () => {

      const isOpen =
        siteNav.classList.toggle(
          "open"
        );


      mobileMenuButton.setAttribute(
        "aria-expanded",

      mobileMenuButton.textContent =

          ? "✕"
          : "☰";

  /* =====================================================
     HELPERS
     ===================================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function displayValue(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "-";
    }


    return escapeHtml(value);
  }


  function getMultiSelectValues(items) {

    if (!Array.isArray(items)) {
      return [];
    }


    return items
      .map(item => {

        if (
          typeof item === "string"
        ) {

          return item;
        }


        return (
          item?.value ||
          item?.name ||
          ""
        );

      })
      .filter(Boolean);
  }


  function renderChips(items) {

    const values =
      getMultiSelectValues(items);


    if (values.length === 0) {

      return `
        <span class="value">
          -
        </span>
      `;
    }


    return `

      <div class="chips">

        ${values.map(value => `

          <span class="chip">
            ${escapeHtml(value)}
          </span>

        `).join("")}

      </div>
    `;
  }


  function hasDashboardAccess(role) {

    return (
      role === "Board" ||
      role === "Admin"
    );
  }


  function isHomePoojaMemberOpen() {
    return Date.now() >= HOME_POOJA_MEMBER_OPENS_AT;
  }


  function canAccessHomePooja(role) {
    return isHomePoojaMemberOpen() || hasDashboardAccess(role);
  }


  function scheduleHomePoojaLaunchRefresh() {
    const delay = HOME_POOJA_MEMBER_OPENS_AT - Date.now();

    if (delay > 0 && delay <= 2147483647) {
      window.setTimeout(
        () => window.location.reload(),
        delay + 1000
      );
    }
  }


  function renderRoleBadge(role) {

    if (role === "Admin") {

      return `
        <span class="admin-badge">
          ADMIN
        </span>
      `;
    }


    if (role === "Board") {

      return `
        <span class="board-badge">
          BOARD
        </span>
      `;
    }


    return "";
  }


  const VOLUNTEER_AREAS = [
    "Pooja",
    "Annadhanam",
    "Bhajan",
    "Media",
    "Decorations"
  ];

  let currentMember = null;
  let currentVolunteers = [];
  let currentDonations = null;
  let currentMaaladharan = null;
  let currentHomePooja = null;
  let homePoojaCalendarMonth = "";
  const HOME_POOJA_MEMBER_OPENS_AT =
    Date.parse("2026-10-14T22:00:00Z");


  function formatCurrency(
    amount,
    currency = "USD"
  ) {

    return new Intl.NumberFormat(
      "en-US",
      {
        style: "currency",
        currency:
          currency || "USD"
      }
    ).format(Number(amount || 0));
  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "-";
    }

    return new Intl.DateTimeFormat(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    ).format(date);
  }


  function formatPortalDate(value) {
    const match = String(value || "")
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);

    if (!match) {
      return formatDate(value);
    }

    const date = new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3]),
      12
    );

    return new Intl.DateTimeFormat(
      "en-US",
      {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    ).format(date);
  }


  function renderDonationSection(donations) {

    const year =
      donations?.year ||
      new Date().getFullYear();

    if (!donations) {

      return `

        <section class="section-card">

          <div class="section-heading-row">

            <h2>
              Donations & Tax Receipts
            </h2>

            <a
              class="donate-button"
              href="https://atlantaayyappasevasangam.org/donations"
            >
              Donate
            </a>

          </div>

          <span class="value">
            Donation information is not available right now.
          </span>

        </section>
      `;
    }

    const payments =
      Array.isArray(donations.payments)
        ? donations.payments
        : [];

    return `

      <section class="section-card">

        <div class="section-heading-row">

          <h2>
            Donations & Tax Receipts
          </h2>

          <a
            class="donate-button"
            href="https://atlantaayyappasevasangam.org/donations"
          >
            Donate
          </a>

        </div>

        <div class="donation-summary">

          <span class="label">
            ${escapeHtml(year)} Donations
          </span>

          <div class="donation-total">
            ${formatCurrency(
              donations.totalPaidThisYear,
              donations.currency
            )}
          </div>

          <div class="donation-meta">
            ${escapeHtml(payments.length)} payment${payments.length === 1 ? "" : "s"}
            ${donations.taxReceiptCount ? ` &middot; ${escapeHtml(donations.taxReceiptCount)} receipt${donations.taxReceiptCount === 1 ? "" : "s"} available` : ""}
          </div>

        </div>

        ${renderDonationPayments(payments)}

      </section>
    `;
  }


  function renderDonationPayments(payments) {

    if (!payments.length) {

      return `
        <span class="value">
          No donations found for this year.
        </span>
      `;
    }

    return payments.map(payment => `

      <div class="donation-payment">

        <div class="donation-payment-row">

          <div>

            <div class="donation-description">
              ${escapeHtml(payment.description || "AAYSSA Donation")}
            </div>

            <div class="donation-date">
              ${escapeHtml(formatDate(payment.date))}
            </div>

          </div>

          <div class="donation-amount">
            ${formatCurrency(
              payment.eligibleAmount ?? payment.amount,
              payment.currency
            )}
          </div>

        </div>

        ${
          payment.receiptUrl
            ? `
              <a
                class="receipt-link"
                href="${escapeHtml(payment.receiptUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Download Tax Receipt
              </a>
            `
            : ""
        }

      </div>
    `).join("");
  }


  function renderVolunteerSection(volunteers) {

    return `

      <section
        id="volunteerSection"
        class="section-card"
      >

        ${renderVolunteerSectionContent(volunteers)}

      </section>
    `;
  }


  function renderVolunteerSectionContent(volunteers) {

    return `

      <div class="section-heading-row">

        <h2>
          Seva & Volunteering
        </h2>

        <button
          id="editVolunteersButton"
          class="small-action-button"
          type="button"
        >
          Edit Volunteering
        </button>

      </div>

      ${renderVolunteerEntries(volunteers)}
    `;
  }


  function renderVolunteerEntries(volunteers) {

    const activeVolunteers =
      Array.isArray(volunteers)
        ? volunteers.filter(volunteer =>
            volunteer && volunteer.active !== false
          )
        : [];


    if (activeVolunteers.length === 0) {

      return `
        <span class="value">
          -
        </span>
      `;
    }


    return activeVolunteers.map(volunteer => `

      <div class="volunteer-entry">

        <div class="volunteer-name">
          ${escapeHtml(volunteer.name || "AAYSSA Member")}
        </div>

        <div class="volunteer-type">
          ${escapeHtml(volunteer.memberTypeLabel || displayVolunteerType(volunteer.memberType))}
        </div>

        ${
          volunteer.interested
            ? renderChips(volunteer.areas || [])
            : `
              <span class="value">
                Not currently volunteering
              </span>
            `
        }

      </div>
    `).join("");
  }


  function renderDirectoryVolunteers(volunteers) {

    const activeVolunteers =
      Array.isArray(volunteers)
        ? volunteers.filter(volunteer =>
            volunteer &&
            volunteer.active !== false &&
            volunteer.interested
          )
        : [];


    if (activeVolunteers.length === 0) {

      return `
        <span class="value">
          -
        </span>
      `;
    }


    return activeVolunteers.map(volunteer => `

      <div class="volunteer-entry">

        <div class="volunteer-name">
          ${escapeHtml(volunteer.name || "AAYSSA Member")}
        </div>

        <div class="volunteer-type">
          ${escapeHtml(volunteer.memberTypeLabel || displayVolunteerType(volunteer.memberType))}
        </div>

        ${renderChips(volunteer.areas || [])}

      </div>
    `).join("");
  }


  async function loadMyVolunteers() {

    const response =
      await fetch(
        "/api/my-volunteers",
        {
          method: "GET",
          credentials: "include"
        }
      );


    if (!response.ok) {
      return [];
    }


    const data =
      await response.json();


    return Array.isArray(data.volunteers)
      ? data.volunteers
      : [];
  }


  async function loadMyDonations() {

    try {

      const response =
        await fetch(
          "/api/my-donations",
          {
            method: "GET",
            credentials: "include"
          }
        );


      if (!response.ok) {
        return null;
      }


      const data =
        await response.json();


      return data.donations || null;

    } catch (error) {

      console.error(
        "Donation load error:",
        error
      );

      return null;
    }
  }


  async function loadMaaladharanRegistrations() {

    try {
      const response =
        await fetch(
          "/api/my-volunteers?resource=maaladharan",
          {
            method: "GET",
            credentials: "include"
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Unable to load registrations."
        );
      }

      return data;

    } catch (error) {
      console.error(
        "Maaladharan registration load error:",
        error
      );

      return {
        season: "2026-27",
        seasonStart: "2026-10-25",
        seasonEnd: "2026-12-04",
        registrations: [],
        error: error.message
      };
    }
  }


  async function loadHomePoojaBookings() {
    try {
      const [response, rsvpResponse] = await Promise.all([
        fetch(
          "/api/my-volunteers?resource=home-pooja",
          { credentials: "include" }
        ),
        fetch(
          "/api/my-volunteers?resource=rsvp",
          { credentials: "include" }
        )
      ]);

      const [data, rsvpData] = await Promise.all([
        response.json(),
        rsvpResponse.json()
      ]);

      if (!response.ok || !data.success) {
        throw new Error(
          data.message ||
          "Unable to load Home Pooja bookings."
        );
      }

      data.rsvpGroups = rsvpResponse.ok && rsvpData.success
        ? rsvpData.groups
        : [];

      return data;
    } catch (error) {
      console.error(error);

      return {
        requests: [],
        calendar: { dates: [] },
        error: error.message
      };
    }
  }


  function renderHomePoojaSection(data) {
    const requests =
      Array.isArray(data?.requests)
        ? data.requests
        : [];

    const dates =
      Array.isArray(data?.calendar?.dates)
        ? data.calendar.dates
        : [];

    const available =
      dates.filter(item =>
        item.status === "Available"
      );
    const rsvpGroups = Array.isArray(data?.rsvpGroups)
      ? data.rsvpGroups
      : [];

    return `
      <section
        id="homePoojaSection"
        class="section-card full-width"
      >
        <div class="section-heading-row">
          <h2>${isHomePoojaMemberOpen()
            ? "Home Pooja Booking"

          ${isHomePoojaMemberOpen()
            ? ""

        </div>

          Mandalam Fridays and November 25–26, 2026:
          5–8 PM.
        </p>

        ${renderHomePoojaCalendar(dates)}

        <div class="info-row registered-swamies-panel">
          <span class="label">Your Bookings</span>
          ${
            requests.length
              ? requests.map(request => `
                  <div class="maaladharan-registration">
                    <strong>
                      ${escapeHtml(formatPortalDate(request.poojaDate))}
                    </strong>
                    <span>
                      ${escapeHtml(request.preferredTime || "")}
                      · ${escapeHtml(
                        displayHomePoojaStatus(request.status)
                      )}
                    </span>
                    ${
                      request.adminNotes
                        ? `<span>${escapeHtml(request.adminNotes)}</span>`
                        : ""
                    }
                    ${["Approved", "Submitted"].includes(request.status)
                      ? `
                        <div class="home-pooja-block-actions">
                          <button class="small-action-button"
                            type="button"
                            data-action="open-invitation"
                            data-invitation-id="${escapeHtml(request.id)}">
                            Create Invitation
                          </button>
                          <button class="small-action-button"
                            type="button"
                            data-action="share-rsvp"
                            data-rsvp-reference="${escapeHtml(request.id)}"
                            data-rsvp-date="${escapeHtml(request.poojaDate)}"
                            data-rsvp-event="${escapeHtml(`Home Pooja on ${formatPortalDate(request.poojaDate)}`)}">
                            Share RSVP Link
                          </button>
                        </div>
                        ${renderHomePoojaInvitationBuilder(request)}
                      `
                      : ""
                    }
                  </div>
                `).join("")
              : "<span>No Home Pooja bookings yet.</span>"
          }
        </div>

        <details class="home-pooja-admin-dropdown">
          <summary>Your Home Pooja RSVPs (${rsvpGroups.reduce((total, group) => total + group.responses.length, 0)})</summary>

            ${renderRsvpGroups(rsvpGroups, "No RSVPs have been submitted for your Home Pooja bookings.")}

  }


  function renderHomePoojaCalendar(
    dates,
    { adminControls = false } = {}
  ) {
    if (!dates.length) {
      return `
        <p class="section-description">
          Calendar availability is temporarily unavailable.
        </p>
      `;
    }

    const dateMap = new Map(
      dates.map(item => [item.date, item])
    );

    const monthKeys = [...new Set(
      dates.map(item => item.date.slice(0, 7))
    )];

    if (!monthKeys.includes(homePoojaCalendarMonth)) {
      homePoojaCalendarMonth = monthKeys[0];
    }

    const monthIndex = monthKeys.indexOf(
      homePoojaCalendarMonth
    );

    const calendarId = adminControls
      ? "homePoojaAdminCalendar"
      : "homePoojaCalendar";

    const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    const renderMonth = monthKey => {
      const [year, month] = monthKey
        .split("-")
        .map(Number);
      const firstDay = new Date(year, month - 1, 1);
      const daysInMonth = new Date(year, month, 0).getDate();
      const cells = [];

      for (let index = 0; index < firstDay.getDay(); index += 1) {
        cells.push('<div class="pooja-calendar-day" aria-hidden="true"></div>');
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const item = dateMap.get(date);
        const status = item?.status || "";
        const statusClass = status.toLowerCase();
        const detail = status === "Booked"
          ? "Booked"
          : status === "Blocked"
            ? adminControls
              ? formatHomePoojaBlockedLabel(item?.reason)
              : formatHomePoojaEventLabel(item?.reason)
            : item
              ? item.time.replace("5:00 PM–8:00 PM", "5–8 PM")
                .replace("9:00 AM–12:00 PM", "9–12")
              : "";

        const bookedDetails =
          status === "Booked" &&
          (
            item?.requesterName ||
            item?.bookingTime ||
            item?.poojaAddress
          )
            ? `
              <small>Booked</small>
              ${item?.requesterName
                ? `<small>${escapeHtml(item.requesterName)}</small>`
                : ""}
              ${item?.bookingTime
                ? `<small>${escapeHtml(item.bookingTime)}</small>`
                : ""}
              ${item?.poojaAddress
                ? `<small class="pooja-calendar-booking-address">${escapeHtml(item.poojaAddress)}</small>`
                : ""}
              ${item?.rsvpSummary
                ? `<small>${Number(item.rsvpSummary.attendingGuests) || 0} attending${item.rsvpSummary.maybeGuests ? ` · ${Number(item.rsvpSummary.maybeGuests)} maybe` : ""}</small>`
                : ""}
            `
            : "";

        cells.push(`
          <div class="pooja-calendar-day ${escapeHtml(statusClass)}"
            title="${escapeHtml(
              item?.poojaAddress ||
              item?.reason ||
              item?.time ||
              "Not offered"
            )}">
            <strong>${day}</strong>
            ${bookedDetails || (detail
              ? `<small>${escapeHtml(detail)}</small>`
              : "")}
            ${
              adminControls && status === "Available"
                ? `
                  <div class="pooja-calendar-admin-actions">
                    <button type="button"
                      data-action="edit-calendar-availability"
                      data-pooja-date="${escapeHtml(date)}"
                      data-pooja-time="${escapeHtml(item?.time || "")}">Edit</button>
                    <button type="button"
                      data-action="remove-availability"
                      data-pooja-date="${escapeHtml(date)}">Remove</button>
                    <button type="button"
                      data-action="block-available-date"
                      data-pooja-date="${escapeHtml(date)}">Block</button>
                  </div>
                `
                : ""
            }
            ${
              adminControls && status === "Blocked"
                ? `
                  <button class="pooja-calendar-unblock"
                    type="button"
                    data-action="unblock-date"
                    data-pooja-date="${escapeHtml(date)}">
                    Unblock
                  </button>
                `
                : ""
            }
          </div>
        `);
      }

      return `
        <section class="pooja-calendar-month">
          <div class="pooja-calendar-grid">
            ${weekdays.map(day => `
              <div class="pooja-calendar-weekday">${day}</div>
            `).join("")}
            ${cells.join("")}
          </div>
        </section>
      `;
    };

    const [selectedYear, selectedMonth] =
      homePoojaCalendarMonth.split("-").map(Number);
    const monthLabel = new Intl.DateTimeFormat(
      "en-US",
      { month: "long", year: "numeric" }
    ).format(new Date(selectedYear, selectedMonth - 1, 1));

    return `
      <div id="${calendarId}">
        <div class="pooja-calendar-legend" aria-label="Calendar legend">
          <span style="--calendar-color:#e9f6ed">Available</span>
          <span style="--calendar-color:#fff0c9">Booked</span>
          <span style="--calendar-color:#ece9e5">
            ${adminControls ? "Blocked" : "AAYSSA Event"}
          </span>
        </div>
        <div class="pooja-calendar-months">
          <div class="pooja-calendar-navigation">
            <button type="button" data-pooja-calendar="previous"
              ${monthIndex === 0 ? "disabled" : ""}>
              ← Previous
            </button>
            <strong>${escapeHtml(monthLabel)}</strong>
            <button type="button" data-pooja-calendar="next"
              ${monthIndex === monthKeys.length - 1 ? "disabled" : ""}>
              Next →
            </button>
          </div>
          ${renderMonth(homePoojaCalendarMonth)}
        </div>
      </div>
    `;
  }

  function formatHomePoojaBlockedLabel(
    reason
  ) {
    const shortLabels = {
      "Pushpabhishekam preparation":
        "Pushpabhishekam Prep",
      "Pushpabhishekam":
        "Pushpabhishekam",
      "Sastha Preethi preparation":
        "Sastha Preethi Prep",
      "Sastha Preethi":
        "Sastha Preethi",
      "Mandalam Closing":
        "Mandalam Closing"
    };

    const label =
      shortLabels[reason] ||
      reason ||
      "Special Event";

    return `Blocked · ${label}`;
  }


  function formatHomePoojaEventLabel(reason) {
    const blockedLabel =
      formatHomePoojaBlockedLabel(reason);

    return blockedLabel.replace(
      /^Blocked · /,
      "AAYSSA Event · "
    );
  }


  function displayHomePoojaStatus(status) {
    return ["Approved", "Submitted"].includes(status)
      ? "Booked"
      : status;
  }


  function setupHomePoojaCalendar(
    datesOverride = null,
    options = {}
  ) {
    const calendarId = options.adminControls
      ? "homePoojaAdminCalendar"
      : "homePoojaCalendar";

    const calendar = document.getElementById(
      calendarId
    );

    const dates = Array.isArray(datesOverride)
      ? datesOverride
      : Array.isArray(
          currentHomePooja?.calendar?.dates
        )
        ? currentHomePooja.calendar.dates
        : [];

    if (!calendar || !dates.length) {
      return;
    }

    const monthKeys = [...new Set(
      dates.map(item => item.date.slice(0, 7))
    )];

    calendar.querySelectorAll(
      "[data-pooja-calendar]"
    ).forEach(button => {
      button.addEventListener("click", () => {
        const currentIndex = monthKeys.indexOf(
          homePoojaCalendarMonth
        );
        const direction =
          button.dataset.poojaCalendar === "next"
            ? 1
            : -1;
        const nextMonth = monthKeys[currentIndex + direction];

        if (!nextMonth) {
          return;
        }

        homePoojaCalendarMonth = nextMonth;
        calendar.outerHTML = renderHomePoojaCalendar(
          dates,
          options
        );
        setupHomePoojaCalendar(
          dates,
          options
        );
      });
    });
  }


  function renderHomePoojaPreview(data) {
    try {
      return renderHomePoojaSection(data);
    } catch (error) {
      console.error(
        "Home Pooja preview render error:",
        error
      );

      return `
        <section class="section-card">
          <h2>${isHomePoojaMemberOpen()
            ? "Home Pooja Booking"
            : "Home Pooja Booking — Board Preview"}</h2>
          <p class="section-description">
            The preview could not be loaded. The rest of your
            membership portal remains available.
          </p>
        </section>
      `;
    }
  }


  function setupHomePoojaForm() {
    setupHomePoojaInvitations();

    const form =
      document.getElementById(
        "homePoojaMemberForm"
      );

    if (!form) {
      return;
    }

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const button =
          form.querySelector(
            'button[type="submit"]'
          );

        const message =
          document.getElementById(
            "homePoojaMemberMessage"
          );

        const values =
          new FormData(form);

        button.disabled = true;
        button.textContent = "Booking…";
        message.textContent = "";

        try {
          const response =
            await fetch(
              "/api/my-volunteers?resource=home-pooja",
              {
                method: "POST",
                credentials: "include",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  requesterName:
                    values.get("requesterName"),
                  phoneNumber:
                    values.get("phoneNumber"),
                  poojaDate:
                    values.get("poojaDate"),
                  poojaAddress:
                    values.get("poojaAddress"),
                  requesterNote:
                    values.get("requesterNote")
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok || !data.success) {
            throw new Error(
              data.message ||
              "Unable to complete the booking."
            );
          }

          currentHomePooja =
            await loadHomePoojaBookings();

          const section =
            document.getElementById(
              "homePoojaSection"
            );

          section.outerHTML =
            renderHomePoojaSection(
              currentHomePooja
            );

          setupHomePoojaForm();
          setupHomePoojaCalendar();
        } catch (error) {
          message.className =
            "inline-message error full-width";
          message.textContent = error.message;
        } finally {
          button.disabled = false;
          button.textContent = "Book Home Pooja";
        }
      }
    );
  }

  function getHomePoojaInvitationPeriod(request) {
    return String(request.preferredTime || "")
      .includes("9:00 AM")

  function getRsvpShareUrl(reference, date = "") {
    const url = new URL("/home-pooja-calendar.html", window.location.origin);
    url.searchParams.set("rsvp", String(reference));
    if (date) {
      url.searchParams.set("date", date);
    }
    return url.toString();
  }


  async function shareRsvpLink(reference, eventLabel, date = "") {
    const url = getRsvpShareUrl(reference, date);
    await navigator.clipboard.writeText(url);
    return "copied";
  }


  function setupHomePoojaInvitations(sectionId = "homePoojaSection") {
    const section = document.getElementById(sectionId);

    if (!section || section.dataset.invitationReady === "true") {
      return;
    }

    section.dataset.invitationReady = "true";

    section.addEventListener("input", event => {
      const builder = event.target.closest("[data-invitation-builder]");

      if (!builder) {
        return;
      }

      const name = builder.querySelector("[data-invitation-name]").value.trim();
      const address = builder.querySelector("[data-invitation-address]").value.trim();
      const theme = builder.querySelector("[data-invitation-theme]").value;
      const preview = builder.querySelector("[data-invitation-preview]");
      builder.querySelector("[data-invitation-host]").textContent =
        name || "Your Host";
      builder.querySelector("[data-invitation-location]").textContent =
        address || "Address to be provided";
      preview.dataset.invitationTheme = theme;
    });

    section.addEventListener("click", async event => {
      const button = event.target.closest("[data-action]");

      if (!button) {
        return;
      }

      const action = button.dataset.action;

      if (action === "share-rsvp") {
        const originalLabel = button.textContent.trim();

        try {
          const result = await shareRsvpLink(
            button.dataset.rsvpReference,
            button.dataset.rsvpEvent || "this Home Pooja",
            button.dataset.rsvpDate || ""
          );

          button.textContent = "RSVP Link Copied";
          window.setTimeout(() => {
            button.textContent = originalLabel;
          }, 2500);
        } catch (error) {
          window.prompt(
            "Copy this RSVP link:",
            getRsvpShareUrl(
              button.dataset.rsvpReference,
              button.dataset.rsvpDate || ""
            )
          );
        }
        return;
      }

      const booking = button.closest(".maaladharan-registration");
      const builder = action === "open-invitation"
        ? booking?.querySelector("[data-invitation-builder]")
        : button.closest("[data-invitation-builder]");

      if (!builder) {
        return;
      }

      if (action === "open-invitation") {
        builder.hidden = false;
        builder.scrollIntoView({ behavior: "smooth", block: "nearest" });
        return;
      }

      if (action === "close-invitation") {
        builder.hidden = true;
        return;
      }

      const preview = builder.querySelector("[data-invitation-preview]");
      const message = builder.querySelector("[data-invitation-message]");

      if (action === "save-invitation-image") {
        if (typeof window.html2canvas !== "function") {
          message.className = "inline-message error";
          message.textContent = "The image exporter is still loading. Please try again.";
          return;
        }

        const isEmbeddedPortal =
          document.documentElement.classList.contains("portal-embedded");
        const imageSaveWindow = isEmbeddedPortal
          ? window.open("", "_blank")
          : null;

        if (isEmbeddedPortal && !imageSaveWindow) {
          message.className = "inline-message error";
          message.textContent =
            "Please allow pop-ups so the invitation image can open for saving.";
          return;
        }

        if (imageSaveWindow) {
          imageSaveWindow.document.write(
            "<!doctype html><title>Preparing AAYSSA Invitation…</title>" +
            "<body style='font-family:Arial,sans-serif;padding:30px;text-align:center'>" +
            "<p>Preparing your invitation image…</p></body>"
          );
          imageSaveWindow.document.close();
        }

        button.disabled = true;
        message.className = "inline-message";
        message.textContent = "Preparing invitation image...";

        try {
          await document.fonts?.ready;
          await Promise.all(
            Array.from(preview.querySelectorAll("img")).map(image =>
              image.decode?.().catch(() => undefined)
            )
          );

          const captureWidth = preview.getBoundingClientRect().width;
          const canvas = await window.html2canvas(preview, {
            backgroundColor: null,
            imageTimeout: 15000,
            logging: false,
            scale: 2,
            scrollX: 0,
            scrollY: -window.scrollY,
            useCORS: true,
            onclone: clonedDocument => {
              const clonedPreview =
                clonedDocument.querySelector("[data-invitation-preview]");
              if (clonedPreview) {
                clonedPreview.style.width = `${captureWidth}px`;
                clonedPreview.style.maxWidth = "none";
                clonedPreview.style.margin = "0";
              }
            }
          });

          if (imageSaveWindow) {
            const imageDataUrl = canvas.toDataURL("image/png");

            if (!imageDataUrl.startsWith("data:image/png")) {
              throw new Error("Empty invitation image.");
            }

            imageSaveWindow.document.open();
            imageSaveWindow.document.write(`
              <!doctype html>
              <html lang="en">
              <head>
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>AAYSSA Invitation</title>
                <style>
                  body{margin:0;padding:20px;background:#252525;color:#fff;
                    font-family:Arial,sans-serif;text-align:center}
                  a{display:inline-block;margin:0 0 18px;padding:12px 20px;
                    border-radius:8px;background:#b36b00;color:#fff;
                    font-weight:700;text-decoration:none}
                  img{display:block;width:auto;max-width:100%;height:auto;margin:auto}
                </style>
              </head>
              <body>
                <a id="invitationDownload" download="aayssa-invitation.png">
                  Download Invitation Image
                </a>
                <p>On iPhone or iPad, touch and hold the image to save it.</p>
                <img id="invitationImage" alt="AAYSSA invitation">
              </body>
              </html>
            `);
            imageSaveWindow.document.close();
            imageSaveWindow.document
              .getElementById("invitationDownload").href = imageDataUrl;
            imageSaveWindow.document
              .getElementById("invitationImage").src = imageDataUrl;
            message.className = "inline-message success";
            message.textContent =
              "Invitation image opened. Use Download Invitation Image in the new tab.";
          } else {
            const blob = await new Promise((resolve, reject) => {
              canvas.toBlob(
                value => value ? resolve(value) : reject(new Error("Empty invitation image.")),
                "image/png"
              );
            });
            const imageUrl = URL.createObjectURL(blob);
            const download = document.createElement("a");
            download.download = "aayssa-invitation.png";
            download.href = imageUrl;
            document.body.appendChild(download);
            download.click();
            download.remove();
            setTimeout(() => URL.revokeObjectURL(imageUrl), 1000);
            message.className = "inline-message success";
            message.textContent = "Invitation image saved.";
          }
        } catch (error) {
          imageSaveWindow?.close();
          message.className = "inline-message error";
          message.textContent = "Unable to save the invitation image.";
        } finally {
          button.disabled = false;
        }
        return;
      }

      if (action === "save-invitation-pdf") {
        const printWindow = window.open("", "_blank");
        const printTitle = preview.querySelector("h3")?.textContent ||
          "AAYSSA Invitation";
        const invitationTheme =
          preview.dataset.invitationTheme || "black";

        if (!printWindow) {
          message.className = "inline-message error";
          message.textContent = "Please allow pop-ups to save the invitation as a PDF.";
          return;
