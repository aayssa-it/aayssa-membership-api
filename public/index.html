      const response =
        await fetch(

          `/api/admin-members?${params.toString()}`,

          {
            method: "GET",
            credentials: "include"
          }
        );


      if (
        response.status === 403
      ) {

        container.innerHTML = `

          <div class="directory-empty error">
            Board or administrator access required.
          </div>
        `;

        return;
      }


      if (!response.ok) {

        throw new Error(
          "Unable to load directory."
        );
      }


      const data =
        await response.json();


      const directory =
        data.directory || {};


      const members =
        Array.isArray(
          directory.members
        )
          ? directory.members
          : [];


      directoryCurrentPage =
        directory.page || 1;


      if (
        members.length === 0
      ) {

        container.innerHTML = `

          <div class="directory-empty">
            No members found.
          </div>
        `;

        return;
      }


      const memberCards =
        members.map(member => {


          const fullName =
            `${member.firstName || ""} ${member.lastName || ""}`
              .trim();


          const spouseName =
            `${member.spouseFirstName || ""} ${member.spouseLastName || ""}`
              .trim();


          return `

            <div class="member-card">


              <div class="member-card-header">


                <div>

                  <div class="member-name">
                    ${escapeHtml(
                      fullName ||
                      "AAYSSA Member"
                    )}
                  </div>


                  <div class="member-meta">

                    Registered:

                    ${displayValue(
                      member.registrationDate
                    )}

                  </div>

                </div>


                ${
                  member.role

                    ? `

                      <div>

                        <span class="role-badge">
                          ${escapeHtml(member.role)}
                        </span>


                        ${
                          member.status

                            ? `

                              <span class="status-badge">
                                ${escapeHtml(member.status)}
                              </span>

                            `

                            : ""
                        }

                      </div>
                    `

                    : ""
                }

              </div>



              <div class="member-detail-grid">


                <div class="member-detail">

                  <span class="label">
                    Email
                  </span>

                  <div class="value">
                    ${displayValue(member.email)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Mobile
                  </span>

                  <div class="value">
                    ${displayValue(member.mobileNumber)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Spouse
                  </span>

                  <div class="value">
                    ${displayValue(spouseName)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Family
                  </span>

                  <div class="value">

                    ${member.noOfAdults ?? 0}
                    Adults /

                    ${member.noOfKids ?? 0}
                    Kids

                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Address
                  </span>

                  <div class="value">
                    ${displayValue(member.address)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Seva Volunteers
                  </span>

                  ${renderDirectoryVolunteers(
                    member.volunteers
                  )}

                </div>

              </div>

            </div>
          `;

        }).join("");


      container.innerHTML = `

        <div class="directory-results">
          ${memberCards}
        </div>


        <div class="pagination">


          <button
            class="page-button"
            id="directoryPrevious"
            ${
              directory.hasPreviousPage
                ? ""
                : "disabled"
            }
          >
            Previous
          </button>


          <span class="page-info">

            Page
            ${directory.page || 1}

            of

            ${directory.totalPages || 1}

            &nbsp;•&nbsp;

            ${directory.total || 0}
            Families

          </span>


          <button
            class="page-button"
            id="directoryNext"
            ${
              directory.hasNextPage
                ? ""
                : "disabled"
            }
          >
            Next
          </button>

        </div>
      `;


      const previous =
        document.getElementById(
          "directoryPrevious"
        );


      const next =
        document.getElementById(
          "directoryNext"
        );


      if (previous) {

        previous.addEventListener(
          "click",
          () =>
            loadMemberDirectory(
              directoryCurrentPage - 1
            )
        );
      }


      if (next) {

        next.addEventListener(
          "click",
          () =>
            loadMemberDirectory(
              directoryCurrentPage + 1
            )
        );
      }


    } catch (error) {

      console.error(
        "Directory error:",
        error
      );


      container.innerHTML = `

        <div class="directory-empty error">
          Unable to load member directory right now.
        </div>
      `;
    }
  }



  /* =====================================================
     DIRECTORY SEARCH
     ===================================================== */

  function setupDirectorySearch() {

    const input =
      document.getElementById(
        "directorySearch"
      );


    const button =
      document.getElementById(
        "directorySearchButton"
      );

    const sort =
      document.getElementById(
        "directorySort"
      );

    if (
      !input ||
      !button ||
      !sort
    ) {
      return;
    }

    sort.value =
      directorySortBy;


    const performSearch = () => {

      directorySearchQuery =
        input.value.trim();


      directoryCurrentPage = 1;


      loadMemberDirectory(1);
    };

    const performSort = () => {

      directorySortBy =
        sort.value === "registeredDate"
          ? "registeredDate"
          : "primaryName";


      directoryCurrentPage = 1;


      loadMemberDirectory(1);
    };


    button.addEventListener(
      "click",
      performSearch
    );

    sort.addEventListener(
      "change",
      performSort
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          performSearch();
        }
      }
    );
  }



  /* =====================================================
     LOAD MEMBER PROFILE
     ===================================================== */

  async function loadMember() {

    const status =
      document.getElementById(
        "status"
      );


    try {

      const response =
        await fetch(

          "/api/me",

          {
            method: "GET",
            credentials: "include"
          }
        );


      if (
        response.status === 401
      ) {

        status.className =
          "message";


        status.innerHTML = `

          <h2>
            No active login session
          </h2>


          <p>
            Please sign in again to access your
            AAYSSA membership portal.
          </p>


          <a
            class="login-button"
            href="https://portal.atlantaayyappasevasangam.org/login-embed.html"
          >
            Member Login
          </a>
        `;


        return;
      }


      if (
        response.status === 403
      ) {

        status.className =
          "message error";


        status.innerHTML = `

          <h2>
            Membership Not Found
          </h2>


          <p>
            Your authenticated email
            could not be matched to an
            AAYSSA membership.
          </p>
        `;


        return;
      }


      if (!response.ok) {

        throw new Error(
          "Unable to load member profile"
        );
      }


      const data =
        await response.json();


      const member =
        data.member;

      currentMember =
        member;

      const optionalResults =
        await Promise.allSettled([
          loadMyVolunteers(),
          loadMyDonations(),
          loadMaaladharanRegistrations(),
          hasDashboardAccess(member.role)
            ? loadHomePoojaBookings()
            : Promise.resolve(null)
        ]);

      const optionalValue =
        (index, fallback) =>
          optionalResults[index].status === "fulfilled"
            ? optionalResults[index].value
            : fallback;

      const volunteers = optionalValue(0, []);
      const donations = optionalValue(1, null);
      const maaladharan = optionalValue(2, {
        registrations: []
      });
      const homePooja = optionalValue(3, null);

      currentVolunteers =
        volunteers;

      currentDonations =
        donations;

      currentMaaladharan =
        maaladharan;

      currentHomePooja =
        homePooja;


      const fullName =
        `${member.firstName || ""} ${member.lastName || ""}`
          .trim();


      status.className = "";


      status.innerHTML = `


        <div class="portal-top-row">

          <div class="welcome">

            Welcome,
            <span id="welcomeName">
            ${escapeHtml(
              fullName ||
              "Member"
            )}
            </span>

            ${renderRoleBadge(
              member.role
            )}

          </div>


          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            Logout
          </button>

        </div>

        <div class="maaladharan-whatsapp-invite">
          Stay connected with the AAYSSA family on WhatsApp.
          <a
            href="https://chat.whatsapp.com/CDH3nm4UUslCpLUxeoBVab?mode=gi_t"
            target="_blank"
            rel="noopener noreferrer"
          >Join the AAYSSA Family WhatsApp Group</a>.
        </div>



        <div class="grid">


          ${renderFamilyDetailsSection(member)}



          ${renderContactSection(member)}


          ${renderMaaladharanSection(
            currentMaaladharan
          )}


          ${
            hasDashboardAccess(member.role)
              ? renderHomePoojaPreview(
                  currentHomePooja
                )
              : ""
          }


          ${renderDonationSection(
            currentDonations
          )}



          ${renderVolunteerSection(
            currentVolunteers
          )}



          ${renderPreferencesSection(member)}

        </div>



        ${
          hasDashboardAccess(
            member.role
          )

            ? `

              <div class="dashboard">


                <div class="dashboard-header">

                  <h2>
                    AAYSSA Dashboard
                  </h2>

                  <p>
                    Organization-wide membership
                    and volunteer overview
                  </p>

                </div>


                <div
                  id="dashboardStats"
                  class="dashboard-loading"
                >
                  Loading dashboard statistics...
                </div>

              </div>
            `

            : ""
        }

      `;


      document
        .getElementById(
          "logoutButton"
        )
        .addEventListener(
          "click",
          logout
        );

      setupVolunteerEditing();
      setupProfileEditing();
      setupMaaladharanForm();
      if (hasDashboardAccess(member.role)) {
        try {
          setupHomePoojaForm();
          setupHomePoojaCalendar();
        } catch (error) {
          console.error(
            "Home Pooja preview setup error:",
            error
          );
        }
      }


      if (
        hasDashboardAccess(
          member.role
        )
      ) {

        await loadDashboardStats();
      }


    } catch (error) {

      console.error(error);


      status.className =
        "message error";


      status.innerHTML = `

        <h2>
          Unable to Load Membership
        </h2>


        <p>${escapeHtml(
          error?.message || "Please try again shortly."
        )}</p>
      `;
    }
  }



  /* =====================================================
     DASHBOARD
     ===================================================== */

  async function loadDashboardStats() {

    const container =
      document.getElementById(
        "dashboardStats"
      );


    if (!container) {
      return;
    }


    try {

      const response =
        await fetch(

          "/api/admin-stats",

          {
            method: "GET",
            credentials: "include"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Unable to load dashboard statistics."
        );
      }


      const data =
        await response.json();


      const stats =
        data.stats || {};


      const volunteer =
        stats.volunteerCounts || {};


      const participation =
        stats.volunteerParticipation || {};

      const donationSummary =
        stats.donationSummary || null;

      const maaladharanSummary =
        stats.maaladharanSummary || null;


      const volunteerSelections =

        Number(
          participation.primaryMember || 0
        )

        +

        Number(
          participation.spouse || 0
        )

        +

        Number(
          participation.otherFamilyMember || 0
        );


      container.className = "";


      container.innerHTML = `


        <div class="stats-grid">


          <div class="stat-card">

            <div class="stat-number">
              ${stats.registeredFamilies ?? 0}
            </div>

            <div class="stat-label">
              Registered Families
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalPeople ?? 0}
            </div>

            <div class="stat-label">
              Total People
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalAdults ?? 0}
            </div>

            <div class="stat-label">
              Adults
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalKids ?? 0}
            </div>

            <div class="stat-label">
              Kids
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${
                donationSummary?.available
                  ? formatCurrency(
                      donationSummary.totalPaidThisYear,
                      donationSummary.currency
                    )
                  : "-"
              }
            </div>

            <div class="stat-label">
              Donations This Year
            </div>

          </div>

        </div>



        <div class="dashboard-grid">


          <div class="dashboard-card">

            <h3>
              Seva Areas of Interest
            </h3>


            ${[
              "Pooja",
              "Annadhanam",
              "Bhajan",
              "Media",
              "Decorations"

            ].map(name => `

              <div class="dashboard-row">

                <strong>
                  ${name}
                </strong>

                <span class="dashboard-number">
                  ${volunteer[name] ?? 0}
                </span>

              </div>

            `).join("")}

          </div>



          <div class="dashboard-card">

            <h3>
              Volunteer Participation
            </h3>

            <div class="dashboard-row">

              <strong>
                Total Volunteers
              </strong>

              <span class="dashboard-number">
                ${volunteerSelections}
              </span>

            </div>


            <div class="dashboard-row">

              <strong>
                Primary Members
              </strong>

              <span class="dashboard-number">
                ${participation.primaryMember ?? 0}
              </span>

            </div>


            <div class="dashboard-row">

              <strong>
                Spouses
              </strong>

              <span class="dashboard-number">
                ${participation.spouse ?? 0}
              </span>

            </div>


            <div class="dashboard-row">

              <strong>
                Other Family Members
              </strong>

              <span class="dashboard-number">
                ${participation.otherFamilyMember ?? 0}
              </span>

            </div>

          </div>

        </div>



        ${renderMaaladharanDashboard(
          maaladharanSummary
        )}

        <div class="dashboard-grid dashboard-trend-grid">
          ${renderDonationTrend(
            donationSummary
          )}

          ${renderRegistrationTrend(
            stats.registrationTrends,
            stats.registrationTrendAvailable
          )}
        </div>

        ${renderMaaladharanDetailDashboard(
          maaladharanSummary
        )}


        ${
          hasDashboardAccess(currentMember?.role)
            ? renderHomePoojaAdminShell()
            : ""
        }


        ${renderMemberDirectoryShell()}
      `;


      setupDirectorySearch();
      setupRegisteredSwamiesSorting();

      if (hasDashboardAccess(currentMember?.role)) {
        await loadHomePoojaAdmin();
      }


      await loadMemberDirectory(1);


    } catch (error) {

      console.error(
        "Dashboard error:",
        error
      );


      container.className =
        "dashboard-loading error";


      container.innerHTML =

        "Unable to load dashboard statistics right now.";
    }
  }



  /* =====================================================
     LOGOUT
     ===================================================== */

  async function logout() {

    const button =
      document.getElementById(
        "logoutButton"
      );


    if (button) {

      button.disabled = true;

      button.textContent =
        "Logging out...";
    }


    try {

      const response =
        await fetch(

          "/api/logout",

          {
            method: "POST",
            credentials: "include"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Logout failed"
        );
      }


      window.location.href =
        "https://atlantaayyappasevasangam.org/";


    } catch (error) {

      console.error(error);


      if (button) {

        button.disabled = false;

        button.textContent =
          "Logout";
      }


      alert(
        "Unable to log out right now. Please try again."
      );
    }
  }



  /* =====================================================
     START PORTAL
     ===================================================== */

  loadMember();

</script>
