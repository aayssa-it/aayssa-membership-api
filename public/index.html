<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AAYSSA Member Portal</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f3;
      color: #222;
    }


    /* =====================================================
       AAYSSA WEBSITE HEADER
       ===================================================== */

    .site-header {
      width: 100%;
      background: #151515;
    }

    .site-header-inner {
      max-width: 2048px;
      min-height: 235px;
      margin: 0 auto;
      padding: 24px 100px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-logo-link {
      display: block;
      text-decoration: none;
    }

    .site-logo {
      width: 170px;
      height: 170px;
      object-fit: contain;
      display: block;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: clamp(24px, 3vw, 52px);
      margin-left: auto;
    }

    .site-nav a {
      color: #e5e3e3;
      text-decoration: none;
      font-size: 18px;
      letter-spacing: 1.7px;
      font-weight: 400;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .site-nav a:hover {
      color: #fff;
    }

    .site-nav .active {
      color: #fff;
      font-weight: 700;
    }

    .nav-with-chevron::after {
      content: "";
      display: inline-block;
      width: 0;
      height: 0;
      margin-left: 9px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid currentColor;
      vertical-align: 2px;
    }

    .mobile-menu-button {
      display: none;
      background: transparent;
      border: 0;
      color: white;
      font-size: 30px;
      cursor: pointer;
      padding: 8px;
    }


    /* =====================================================
       PORTAL HEADING
       ===================================================== */

    .portal-heading {
      text-align: center;
      padding: 70px 20px 38px;
      background: white;
    }

    .portal-heading h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #111;
    }

    .heading-divider {
      width: 62px;
      height: 2px;
      background: #ddd;
      margin: 34px auto 28px;
    }

    .mantra {
      color: #b56800;
      font-size: 20px;
      font-weight: 700;
    }


    /* =====================================================
       MAIN PAGE
       ===================================================== */

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 38px 18px 55px;
    }

    .portal-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .welcome {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 400;
      margin-bottom: 0;
    }


    /* =====================================================
       MEMBER CARDS
       ===================================================== */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .grid > .section-card.full-width {
      grid-column: 1 / -1;
    }

    .section-card,
    .dashboard-card,
    .trend-card,
    .directory-card {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .section-card h2,
    .dashboard-card h3,
    .trend-card h3,
    .directory-card h3 {
      margin: 0 0 16px;
      color: #8b5100;
    }

    .section-card h2 {
      font-size: 18px;
    }

    .info-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      display: block;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 15px;
      overflow-wrap: anywhere;
    }


    /* =====================================================
       CHIPS
       ===================================================== */

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .chip {
      background: #f4eadb;
      color: #754200;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
    }


    /* =====================================================
       VOLUNTEERING
       ===================================================== */

    .section-heading-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-heading-row h2 {
      margin: 0;
    }

    .small-action-button,
    .secondary-button,
    .danger-button {
      border: none;
      border-radius: 7px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .small-action-button {
      background: #b96c00;
      color: white;
    }

    .secondary-button {
      background: #333;
      color: white;
    }

    .danger-button {
      background: #f7e8e8;
      color: #9b2424;
    }

    .volunteer-entry {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .volunteer-entry:last-child {
      border-bottom: none;
    }

    .volunteer-name {
      font-weight: 800;
      color: #333;
    }

    .volunteer-type {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .volunteer-form {
      display: grid;
      gap: 18px;
    }

    .volunteer-form-row {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 15px;
      background: #fffdf9;
    }

    .volunteer-form-title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .form-field {
      display: grid;
      gap: 5px;
      margin-top: 10px;
    }

    .form-field label,
    .checkbox-label {
      color: #555;
      font-size: 13px;
      font-weight: 700;
    }

    .field-help {
      color: #777;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }

    .form-field input[type="text"],
    .form-field input[type="tel"],
    .form-field input[type="date"],
    .form-field input[type="email"],
    .form-field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      font-size: 14px;
    }

    .form-field input[type="number"],
    .form-field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .form-field textarea {
      min-height: 88px;
      resize: vertical;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .checkbox-label[hidden] {
      display: none;
    }

    .area-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 9px;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }


    /* =====================================================
       MAALADHARAN REGISTRATION
       ===================================================== */

    .maaladharan-card {
      grid-column: 1 / -1;
    }

    .maaladharan-intro {
      margin: -4px 0 18px;
      color: #555;
      line-height: 1.55;
    }

    .maaladharan-schedule {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .maaladharan-date {
      padding: 14px;
      border: 1px solid #ead8bb;
      border-radius: 10px;
      background: #fff8ec;
    }

    .maaladharan-date strong {
      display: block;
      color: #8b5100;
      margin-bottom: 4px;
    }

    .registered-swamies-panel {
      margin-bottom: 22px;
      padding: 16px;
      border: 1px solid #d5e7da;
      border-radius: 10px;
      background: #f0f7f2;
    }

    .registered-swamies-panel .label {
      color: #26783c;
      margin-bottom: 8px;
    }

    .pooja-calendar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 12px 0;
      font-size: 13px;
    }

    .pooja-calendar-legend span::before {
      content: "";
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 5px;
      border-radius: 3px;
      vertical-align: -1px;
      background: var(--calendar-color);
    }

    .pooja-calendar-months {
      margin: 16px 0 24px;
    }

    .pooja-calendar-navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .pooja-calendar-navigation button {
      min-width: 92px;
      padding: 8px 12px;
      border: 1px solid #b97716;
      border-radius: 8px;
      background: #fffaf2;
      color: #774500;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .pooja-calendar-navigation button:disabled {
      border-color: #d8d3cc;
      color: #aaa49c;
      cursor: not-allowed;
    }

    .pooja-calendar-navigation strong {
      color: #5b3510;
      text-align: center;
    }

    .pooja-calendar-month {
      padding: 14px;
      border: 1px solid #e3ded4;
      border-radius: 12px;
      background: #fff;
      overflow-x: auto;
    }

    .pooja-calendar-month h3 {
      margin: 0 0 12px;
      text-align: center;
      color: #5b3510;
    }

    .pooja-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      min-width: 700px;
    }

    .pooja-calendar-weekday {
      padding-bottom: 4px;
      color: #716b63;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .pooja-calendar-day {
      min-height: 45px;
      padding: 5px 3px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: #aaa49c;
      font-size: 12px;
      text-align: center;
    }

    .pooja-calendar-day strong,
    .pooja-calendar-day small {
      display: block;
    }

    .pooja-calendar-day small {
      margin-top: 3px;
      font-size: 9px;
      line-height: 1.15;
    }

    .pooja-calendar-day.available {
      border-color: #b9dbc3;
      background: #e9f6ed;
      color: #1f6834;
    }

    .pooja-calendar-day.booked {
      min-height: 105px;
      border-color: #e3b95e;
      background: #fff0c9;
      color: #704300;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .pooja-calendar-booking-address {
      font-weight: 500;
    }

    .pooja-calendar-day.blocked {
      border-color: #d5d1cc;
      background: #ece9e5;
      color: #6f6962;
    }

    .pooja-calendar-unblock {
      margin-top: 4px;
      padding: 3px 5px;
      border: 1px solid #8b4f16;
      border-radius: 5px;
      background: #fff;
      color: #713d0d;
      font: inherit;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .home-pooja-block-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .home-pooja-block-edit-form,
    .home-pooja-booking-edit-form {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #e3ded4;
      border-radius: 8px;
      background: #fffaf3;
    }

    .home-pooja-block-edit-form[hidden],
    .home-pooja-booking-edit-form[hidden] {
      display: none;
    }

    .maaladharan-registration {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .maaladharan-registration-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .maaladharan-registration-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .withdrawn-badge {
      background: #777;
    }

    .maaladharan-edit-form {
      margin-top: 12px;
      padding: 15px;
      border: 1px solid #ead8bb;
      border-radius: 10px;
      background: #fffdf9;
    }

    .maaladharan-registration:last-child {
      border-bottom: 0;
    }

    .maaladharan-registration-meta {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }

    .maaladharan-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 16px;
      padding-top: 4px;
    }

    .maaladharan-form .full-width {
      grid-column: 1 / -1;
    }

    .maaladharan-form .form-actions {
      margin-top: 14px;
    }

    .maaladharan-required-marker {
      color: #b3261e;
      font-weight: 800;
    }

    .maaladharan-required-note {
      grid-column: 1 / -1;
      margin: 0 0 8px;
      color: #666;
      font-size: 12px;
    }

    .maaladharan-whatsapp-invite {
      margin: 16px 0;
      padding: 14px 16px;
      border: 1px solid #b9d9c1;
      border-radius: 10px;
      background: #f0faf2;
      color: #245f34;
    }

    .maaladharan-whatsapp-invite a {
      color: #176b30;
      font-weight: 800;
    }

    .inline-message {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .maaladharan-schedule,
      .maaladharan-form {
        grid-template-columns: 1fr;
      }

      .maaladharan-form .full-width {
        grid-column: auto;
      }
    }


    /* =====================================================
       COMMUNICATION PREFERENCES
       ===================================================== */

    .preference {
      display: inline-block;
      margin-right: 12px;
      margin-bottom: 8px;
      padding: 7px 11px;
      border-radius: 8px;
      background: #f4f4f4;
      font-size: 13px;
      font-weight: 700;
    }

    .preference-on {
      background: #e6f4e9;
      color: #26783c;
    }

    .preference-off {
      color: #777;
    }


    /* =====================================================
       DONATIONS
       ===================================================== */

    .donation-summary {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fffdf9;
      margin-bottom: 14px;
    }

    .donation-total {
      font-size: 30px;
      font-weight: 800;
      color: #8b5100;
      margin-top: 4px;
    }

    .donation-meta {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .donation-payment {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .donation-payment:last-child {
      border-bottom: none;
    }

    .donation-payment-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .donation-description {
      font-weight: 800;
      color: #333;
    }

    .donation-date {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .donation-amount {
      color: #8b5100;
      font-weight: 800;
      white-space: nowrap;
    }

    .receipt-link {
      display: inline-block;
      margin-top: 9px;
      padding: 8px 11px;
      border-radius: 7px;
      background: #333;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .donate-button {
      display: inline-block;
      padding: 9px 13px;
      border-radius: 7px;
      background: #b96c00;
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .donate-button:hover {
      background: #995900;
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .edit-button,
    .logout-button,
    .login-button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 7px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    .edit-button,
    .login-button {
      background: #b96c00;
      color: white;
    }

    .edit-button:hover,
    .login-button:hover {
      background: #995900;
    }

    .logout-button {
      background: #333;
      color: white;
    }

    .logout-button:hover {
      background: #111;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* =====================================================
       LOADING / MESSAGES
       ===================================================== */

    .loading,
    .message,
    .dashboard-loading {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .error {
      color: #a32929;
    }


    /* =====================================================
       ROLE BADGES
       ===================================================== */

    .admin-badge,
    .board-badge,
    .role-badge,
    .status-badge {
      display: inline-block;
      color: white;
      padding: 5px 10px;
      border-radius: 999px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      vertical-align: middle;
    }

    .admin-badge,
    .role-badge {
      background: #8b5100;
    }

    .board-badge {
      background: #555;
    }

    .status-badge {
      background: #26783c;
    }


    /* =====================================================
       DASHBOARD
       ===================================================== */

    .dashboard {
      margin-top: 38px;
      padding-top: 34px;
      border-top: 1px solid #ddd7ce;
    }

    .dashboard-header {
      margin-bottom: 20px;
    }

    .dashboard-header h2 {
      margin: 0 0 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-weight: 400;
      color: #111;
    }

    .dashboard-header p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      color: #8b5100;
      white-space: nowrap;
    }

    .stat-label {
      margin-top: 6px;
      font-size: 11px;
      color: #777;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.4;
      min-height: 31px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .dashboard-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .dashboard-row:last-child {
      border-bottom: none;
    }

    .dashboard-number {
      font-weight: 800;
      color: #8b5100;
    }


    /* =====================================================
       REGISTRATION TREND
       ===================================================== */

    .trend-card {
      margin-top: 20px;
    }

    .maaladharan-dashboard-grid {
      align-items: stretch;
    }

    .maaladharan-dashboard-grid .trend-card {
      min-width: 0;
      margin-top: 0;
    }

    .dashboard-trend-grid .trend-card {
      min-width: 0;
      margin-top: 0;
    }

    .dashboard-trend-grid .trend-chart {
      min-width: 0;
    }

    .dashboard-trend-grid .trend-column {
      min-width: 0;
    }

    .registered-swamies-list {
      max-height: 340px;
      overflow-x: auto;
      overflow-y: auto;
    }

    .registered-swamies-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .registered-swamies-table th,
    .registered-swamies-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
      white-space: nowrap;
    }

    .registered-swamies-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fffaf3;
    }

    .swamy-sort-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #5f2b10;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .swamy-sort-button:hover,
    .swamy-sort-button:focus-visible {
      text-decoration: underline;
    }

    .trend-subtitle,
    .directory-subtitle {
      color: #777;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 22px;
    }

    .trend-chart-scroll {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .trend-chart {
      min-width: 700px;
      height: 300px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border-bottom: 2px solid #ddd;
      padding: 30px 10px 0;
    }

<script>

  let directoryCurrentPage = 1;
  let directorySearchQuery = "";
  let directorySortBy = "primaryName";


  /* =====================================================
     MOBILE MENU
     ===================================================== */

  const mobileMenuButton =
    document.getElementById(
      "mobileMenuButton"
    );


  const siteNav =
    document.getElementById(
      "siteNav"
    );


  mobileMenuButton.addEventListener(
    "click",
    () => {

      const isOpen =
        siteNav.classList.toggle(
          "open"
        );


      mobileMenuButton.setAttribute(
        "aria-expanded",
        isOpen
          ? "true"
          : "false"
      );


      mobileMenuButton.textContent =
        isOpen
          ? "✕"
          : "☰";
    }
  );



  /* =====================================================
     HELPERS
     ===================================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function displayValue(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "-";
    }


    return escapeHtml(value);
  }


  function getMultiSelectValues(items) {

    if (!Array.isArray(items)) {
      return [];
    }


    return items
      .map(item => {

        if (
          typeof item === "string"
        ) {

          return item;
        }


        return (
          item?.value ||
          item?.name ||
          ""
        );

      })
      .filter(Boolean);
  }


  function renderChips(items) {

    const values =
      getMultiSelectValues(items);


    if (values.length === 0) {

      return `
        <span class="value">
          -
        </span>
      `;
    }


    return `

      <div class="chips">

        ${values.map(value => `

          <span class="chip">
            ${escapeHtml(value)}
          </span>

        `).join("")}

      </div>
    `;
  }


  function hasDashboardAccess(role) {

    return (
      role === "Board" ||
      role === "Admin"
    );
  }


  function renderRoleBadge(role) {

    if (role === "Admin") {

      return `
        <span class="admin-badge">
          ADMIN
        </span>
      `;
    }


    if (role === "Board") {

      return `
        <span class="board-badge">
          BOARD
        </span>
      `;
    }


    return "";
  }


  const VOLUNTEER_AREAS = [
    "Pooja",
    "Annadhanam",
    "Bhajan",
    "Media",
    "Decorations"
  ];

  let currentMember = null;
  let currentVolunteers = [];
  let currentDonations = null;
  let currentMaaladharan = null;
  let currentHomePooja = null;
  let homePoojaCalendarMonth = "";


  function formatCurrency(
    amount,
    currency = "USD"
  ) {

    return new Intl.NumberFormat(
      "en-US",
      {
        style: "currency",
        currency:
          currency || "USD"
      }
    ).format(Number(amount || 0));
  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "-";
    }

    return new Intl.DateTimeFormat(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    ).format(date);
  }


  function formatPortalDate(value) {
    const match = String(value || "")
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);

    if (!match) {
      return formatDate(value);
    }

    const date = new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3]),
      12
    );

    return new Intl.DateTimeFormat(
      "en-US",
      {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    ).format(date);
  }


  function renderDonationSection(donations) {

    const year =
      donations?.year ||
      new Date().getFullYear();

    if (!donations) {

      return `

        <section class="section-card">

          <div class="section-heading-row">

            <h2>
              Donations & Tax Receipts
            </h2>

            <a
              class="donate-button"
              href="https://atlantaayyappasevasangam.org/donations"
            >
              Donate
            </a>

          </div>

          <span class="value">
            Donation information is not available right now.
          </span>

        </section>
      `;
    }

    const payments =
      Array.isArray(donations.payments)
        ? donations.payments
        : [];

    return `

      <section class="section-card">

        <div class="section-heading-row">

          <h2>
            Donations & Tax Receipts
          </h2>

          <a
            class="donate-button"
            href="https://atlantaayyappasevasangam.org/donations"
          >
            Donate
          </a>

        </div>

        <div class="donation-summary">

          <span class="label">
            ${escapeHtml(year)} Donations
          </span>

          <div class="donation-total">
            ${formatCurrency(
              donations.totalPaidThisYear,
              donations.currency
            )}
          </div>

          <div class="donation-meta">
            ${escapeHtml(payments.length)} payment${payments.length === 1 ? "" : "s"}
            ${donations.taxReceiptCount ? ` &middot; ${escapeHtml(donations.taxReceiptCount)} receipt${donations.taxReceiptCount === 1 ? "" : "s"} available` : ""}
          </div>

        </div>

        ${renderDonationPayments(payments)}

      </section>
    `;
  }


  function renderDonationPayments(payments) {

    if (!payments.length) {

      return `
        <span class="value">
          No donations found for this year.
        </span>
      `;
    }

    return payments.map(payment => `

      <div class="donation-payment">

        <div class="donation-payment-row">

          <div>

            <div class="donation-description">
              ${escapeHtml(payment.description || "AAYSSA Donation")}
            </div>

            <div class="donation-date">
              ${escapeHtml(formatDate(payment.date))}
            </div>

          </div>

          <div class="donation-amount">
            ${formatCurrency(
              payment.eligibleAmount ?? payment.amount,
              payment.currency
            )}
          </div>

        </div>

        ${
          payment.receiptUrl
            ? `
              <a
                class="receipt-link"
                href="${escapeHtml(payment.receiptUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Download Tax Receipt
              </a>
            `
            : ""
        }

      </div>
    `).join("");
  }


  function renderVolunteerSection(volunteers) {

    return `

      <section
        id="volunteerSection"
        class="section-card"
      >

        ${renderVolunteerSectionContent(volunteers)}

      </section>
    `;
  }


  function renderVolunteerSectionContent(volunteers) {

    return `

      <div class="section-heading-row">

        <h2>
          Seva & Volunteering
        </h2>

        <button
          id="editVolunteersButton"
          class="small-action-button"
          type="button"
        >
          Edit Volunteering
        </button>

      </div>

      ${renderVolunteerEntries(volunteers)}
    `;
  }


  function renderVolunteerEntries(volunteers) {

    const activeVolunteers =
      Array.isArray(volunteers)
        ? volunteers.filter(volunteer =>
            volunteer && volunteer.active !== false
          )
        : [];


    if (activeVolunteers.length === 0) {

      return `
        <span class="value">
          -
        </span>
      `;
    }


    return activeVolunteers.map(volunteer => `

      <div class="volunteer-entry">

        <div class="volunteer-name">
          ${escapeHtml(volunteer.name || "AAYSSA Member")}
        </div>

        <div class="volunteer-type">
          ${escapeHtml(volunteer.memberTypeLabel || displayVolunteerType(volunteer.memberType))}
        </div>

        ${
          volunteer.interested
            ? renderChips(volunteer.areas || [])
            : `
              <span class="value">
                Not currently volunteering
              </span>
            `
        }

      </div>
    `).join("");
  }


  function renderDirectoryVolunteers(volunteers) {

    const activeVolunteers =
      Array.isArray(volunteers)
        ? volunteers.filter(volunteer =>
            volunteer &&
            volunteer.active !== false &&
            volunteer.interested
          )
        : [];


    if (activeVolunteers.length === 0) {

      return `
        <span class="value">
          -
        </span>
      `;
    }


    return activeVolunteers.map(volunteer => `

      <div class="volunteer-entry">

        <div class="volunteer-name">
          ${escapeHtml(volunteer.name || "AAYSSA Member")}
        </div>

        <div class="volunteer-type">
          ${escapeHtml(volunteer.memberTypeLabel || displayVolunteerType(volunteer.memberType))}
        </div>

        ${renderChips(volunteer.areas || [])}

      </div>
    `).join("");
  }


  async function loadMyVolunteers() {

    const response =
      await fetch(
        "/api/my-volunteers",
        {
          method: "GET",
          credentials: "include"
        }
      );


    if (!response.ok) {
      return [];
    }


    const data =
      await response.json();


    return Array.isArray(data.volunteers)
      ? data.volunteers
      : [];
  }


  async function loadMyDonations() {

    try {

      const response =
        await fetch(
          "/api/my-donations",
          {
            method: "GET",
            credentials: "include"
          }
        );


      if (!response.ok) {
        return null;
      }


      const data =
        await response.json();


      return data.donations || null;

    } catch (error) {

      console.error(
        "Donation load error:",
        error
      );

      return null;
    }
  }


  async function loadMaaladharanRegistrations() {

    try {
      const response =
        await fetch(
          "/api/my-volunteers?resource=maaladharan",
          {
            method: "GET",
            credentials: "include"
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Unable to load registrations."
        );
      }

      return data;

    } catch (error) {
      console.error(
        "Maaladharan registration load error:",
        error
      );

      return {
        season: "2026-27",
        seasonStart: "2026-10-25",
        seasonEnd: "2026-12-04",
        registrations: [],
        error: error.message
      };
    }
  }


  async function loadHomePoojaBookings() {
    try {
      const response =
        await fetch(
          "/api/my-volunteers?resource=home-pooja",
          { credentials: "include" }
        );

      const data =
        await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.message ||
          "Unable to load Home Pooja bookings."
        );
      }

      return data;
    } catch (error) {
      console.error(error);

      return {
        requests: [],
        calendar: { dates: [] },
        error: error.message
      };
    }
  }


  function renderHomePoojaSection(data) {
    const requests =
      Array.isArray(data?.requests)
        ? data.requests
        : [];

    const dates =
      Array.isArray(data?.calendar?.dates)
        ? data.calendar.dates
        : [];

    const available =
      dates.filter(item =>
        item.status === "Available"
      );

    return `
      <section
        id="homePoojaSection"
        class="section-card full-width"
      >
        <div class="section-heading-row">
          <h2>Home Pooja Booking — Board Preview</h2>
          <span class="status-badge">
            Not Public Yet
          </span>
        </div>

        <p class="section-description">
          Saturday: 5–8 PM · Sunday: 9 AM–12 PM.
          Mandalam Fridays and November 25–26, 2026:
          5–8 PM.
        </p>

        ${renderHomePoojaCalendar(dates)}

        <div class="info-row registered-swamies-panel">
          <span class="label">Your Bookings</span>
          ${
            requests.length
              ? requests.map(request => `
                  <div class="maaladharan-registration">
                    <strong>
                      ${escapeHtml(formatPortalDate(request.poojaDate))}
                    </strong>
                    <span>
                      ${escapeHtml(request.preferredTime || "")}
                      · ${escapeHtml(
                        displayHomePoojaStatus(request.status)
                      )}
                    </span>
                    ${
                      request.adminNotes
                        ? `<span>${escapeHtml(request.adminNotes)}</span>`
                        : ""
                    }
                  </div>
                `).join("")
              : "<span>No Home Pooja bookings yet.</span>"
          }
        </div>

        <form id="homePoojaMemberForm" class="maaladharan-form">
          <div class="form-field">
            <label for="memberHomePoojaName">Requester Name</label>
            <input id="memberHomePoojaName" name="requesterName"
              type="text"
              value="${escapeHtml(getCurrentFullName(currentMember))}"
              required>
          </div>
          <div class="form-field">
            <label for="memberHomePoojaPhone">Phone Number</label>
            <input id="memberHomePoojaPhone" name="phoneNumber"
              type="tel"
              value="${escapeHtml(currentMember?.mobileNumber || "")}"
              required>
          </div>
          <div class="form-field full-width">
            <label for="memberHomePoojaDate">Available Date</label>
            <select id="memberHomePoojaDate" name="poojaDate" required>
              <option value="">Select an available date</option>
              ${available.map(item => `
                <option value="${escapeHtml(item.date)}">
                  ${escapeHtml(formatPortalDate(item.date))}
                  — ${escapeHtml(item.time)}
                </option>
              `).join("")}
            </select>
          </div>
          <div class="form-field full-width">
            <label for="memberHomePoojaAddress">Pooja Address</label>
            <textarea id="memberHomePoojaAddress"
              name="poojaAddress" required></textarea>
          </div>
          <div class="form-field full-width">
            <label for="memberHomePoojaNote">Notes (optional)</label>
            <textarea id="memberHomePoojaNote"
              name="requesterNote" maxlength="1000"></textarea>
          </div>
          <div class="form-actions full-width">
            <button class="small-action-button" type="submit">
              Book Home Pooja
            </button>
          </div>
          <div id="homePoojaMemberMessage"
            class="inline-message full-width"
            role="status" aria-live="polite"></div>
        </form>
      </section>
    `;
  }


  function renderHomePoojaCalendar(
    dates,
    { adminControls = false } = {}
  ) {
    if (!dates.length) {
      return `
        <p class="section-description">
          Calendar availability is temporarily unavailable.
        </p>
      `;
    }

    const dateMap = new Map(
      dates.map(item => [item.date, item])
    );

    const monthKeys = [...new Set(
      dates.map(item => item.date.slice(0, 7))
    )];

    if (!monthKeys.includes(homePoojaCalendarMonth)) {
      homePoojaCalendarMonth = monthKeys[0];
    }

    const monthIndex = monthKeys.indexOf(
      homePoojaCalendarMonth
    );

    const calendarId = adminControls
      ? "homePoojaAdminCalendar"
      : "homePoojaCalendar";

    const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    const renderMonth = monthKey => {
      const [year, month] = monthKey
        .split("-")
        .map(Number);
      const firstDay = new Date(year, month - 1, 1);
      const daysInMonth = new Date(year, month, 0).getDate();
      const cells = [];

      for (let index = 0; index < firstDay.getDay(); index += 1) {
        cells.push('<div class="pooja-calendar-day" aria-hidden="true"></div>');
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const item = dateMap.get(date);
        const status = item?.status || "";
        const statusClass = status.toLowerCase();
        const detail = status === "Booked"
          ? "Booked"
          : status === "Blocked"
            ? adminControls
              ? formatHomePoojaBlockedLabel(item?.reason)
              : formatHomePoojaEventLabel(item?.reason)
            : item
              ? item.time.replace("5:00 PM–8:00 PM", "5–8 PM")
                .replace("9:00 AM–12:00 PM", "9–12")
              : "";

        const bookedDetails =
          status === "Booked" &&
          (
            item?.requesterName ||
            item?.bookingTime ||
            item?.poojaAddress
          )
            ? `
              <small>Booked</small>
              ${item?.requesterName
                ? `<small>${escapeHtml(item.requesterName)}</small>`
                : ""}
              ${item?.bookingTime
                ? `<small>${escapeHtml(item.bookingTime)}</small>`
                : ""}
              ${item?.poojaAddress
                ? `<small class="pooja-calendar-booking-address">${escapeHtml(item.poojaAddress)}</small>`
                : ""}
            `
            : "";

        cells.push(`
          <div class="pooja-calendar-day ${escapeHtml(statusClass)}"
            title="${escapeHtml(
              item?.poojaAddress ||
              item?.reason ||
              item?.time ||
              "Not offered"
            )}">
            <strong>${day}</strong>
            ${bookedDetails || (detail
              ? `<small>${escapeHtml(detail)}</small>`
              : "")}
            ${
              adminControls && status === "Blocked"
                ? `
                  <button class="pooja-calendar-unblock"
                    type="button"
                    data-action="unblock-date"
                    data-pooja-date="${escapeHtml(date)}">
                    Unblock
                  </button>
                `
                : ""
            }
          </div>
        `);
      }

      return `
        <section class="pooja-calendar-month">
          <div class="pooja-calendar-grid">
            ${weekdays.map(day => `
              <div class="pooja-calendar-weekday">${day}</div>
            `).join("")}
            ${cells.join("")}
          </div>
        </section>
      `;
    };

    const [selectedYear, selectedMonth] =
      homePoojaCalendarMonth.split("-").map(Number);
    const monthLabel = new Intl.DateTimeFormat(
      "en-US",
      { month: "long", year: "numeric" }
    ).format(new Date(selectedYear, selectedMonth - 1, 1));

    return `
      <div id="${calendarId}">
        <div class="pooja-calendar-legend" aria-label="Calendar legend">
          <span style="--calendar-color:#e9f6ed">Available</span>
          <span style="--calendar-color:#fff0c9">Booked</span>
          <span style="--calendar-color:#ece9e5">
            ${adminControls ? "Blocked" : "AAYSSA Event"}
          </span>
        </div>
        <div class="pooja-calendar-months">
          <div class="pooja-calendar-navigation">
            <button type="button" data-pooja-calendar="previous"
              ${monthIndex === 0 ? "disabled" : ""}>
              ← Previous
            </button>
            <strong>${escapeHtml(monthLabel)}</strong>
            <button type="button" data-pooja-calendar="next"
              ${monthIndex === monthKeys.length - 1 ? "disabled" : ""}>
              Next →
            </button>
          </div>
          ${renderMonth(homePoojaCalendarMonth)}
        </div>
      </div>
    `;
  }


  function formatHomePoojaBlockedLabel(
    reason
  ) {
    const shortLabels = {
      "Pushpabhishekam preparation":
        "Pushpabhishekam Prep",
      "Pushpabhishekam":
        "Pushpabhishekam",
      "Sastha Preethi preparation":
        "Sastha Preethi Prep",
      "Sastha Preethi":
        "Sastha Preethi",
      "Mandalam Closing":
        "Mandalam Closing"
    };

    const label =
      shortLabels[reason] ||
      reason ||
      "Special Event";

    return `Blocked · ${label}`;
  }


  function formatHomePoojaEventLabel(reason) {
    const blockedLabel =
      formatHomePoojaBlockedLabel(reason);

    return blockedLabel.replace(
      /^Blocked · /,
      "AAYSSA Event · "
    );
  }


  function displayHomePoojaStatus(status) {
    return ["Approved", "Submitted"].includes(status)
      ? "Booked"
      : status;
  }


  function setupHomePoojaCalendar(
    datesOverride = null,
    options = {}
  ) {
    const calendarId = options.adminControls
      ? "homePoojaAdminCalendar"
      : "homePoojaCalendar";

    const calendar = document.getElementById(
      calendarId
    );

    const dates = Array.isArray(datesOverride)
      ? datesOverride
      : Array.isArray(
          currentHomePooja?.calendar?.dates
        )
        ? currentHomePooja.calendar.dates
        : [];

    if (!calendar || !dates.length) {
      return;
    }

    const monthKeys = [...new Set(
      dates.map(item => item.date.slice(0, 7))
    )];

    calendar.querySelectorAll(
      "[data-pooja-calendar]"
    ).forEach(button => {
      button.addEventListener("click", () => {
        const currentIndex = monthKeys.indexOf(
          homePoojaCalendarMonth
        );
        const direction =
          button.dataset.poojaCalendar === "next"
            ? 1
            : -1;
        const nextMonth = monthKeys[currentIndex + direction];

        if (!nextMonth) {
          return;
        }

        homePoojaCalendarMonth = nextMonth;
        calendar.outerHTML = renderHomePoojaCalendar(
          dates,
          options
        );
        setupHomePoojaCalendar(
          dates,
          options
        );
      });
    });
  }

  function setupHomePoojaForm() {
    const form =
      document.getElementById(
        "homePoojaMemberForm"
      );

    if (!form) {
      return;
    }

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const button =
          form.querySelector(
            'button[type="submit"]'
          );

        const message =
          document.getElementById(
            "homePoojaMemberMessage"
          );

        const values =
          new FormData(form);

        button.disabled = true;
        button.textContent = "Booking…";
        message.textContent = "";

        try {
          const response =
            await fetch(
              "/api/my-volunteers?resource=home-pooja",
              {
                method: "POST",
                credentials: "include",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  requesterName:
                    values.get("requesterName"),
                  phoneNumber:
                    values.get("phoneNumber"),
                  poojaDate:
                    values.get("poojaDate"),
                  poojaAddress:
                    values.get("poojaAddress"),
                  requesterNote:
                    values.get("requesterNote")
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok || !data.success) {
            throw new Error(
              data.message ||
              "Unable to complete the booking."
            );
          }

          currentHomePooja =
            await loadHomePoojaBookings();

          const section =
            document.getElementById(
              "homePoojaSection"
            );

          section.outerHTML =
            renderHomePoojaSection(
              currentHomePooja
            );

          setupHomePoojaForm();
          setupHomePoojaCalendar();
        } catch (error) {
          message.className =
            "inline-message error full-width";
          message.textContent = error.message;
        } finally {
          button.disabled = false;
          button.textContent = "Book Home Pooja";
        }
      }
    );
  }

  function setupMaaladharanEditForm(form) {

    if (!form) {
      return;
    }

    const registrationId =
      form.dataset.registrationId;

    const padiInput =
      form.elements.padiStatus;

    const firstDeekshaIndicator =
      form.querySelector(
        ".first-deeksha-edit-indicator"
      );

    const firstDeekshaCheckbox =
      form.querySelector(
        ".first-deeksha-edit-checkbox"
      );

    const updateFirstDeekshaIndicator =
      () => {
        const isFirstDeeksha =
          padiInput.value ===
            "0 (Kanni Swamy)";

        if (firstDeekshaIndicator) {
          firstDeekshaIndicator.hidden =
            !isFirstDeeksha;
        }

        if (firstDeekshaCheckbox) {
          firstDeekshaCheckbox.checked =
            isFirstDeeksha;
        }
      };

    padiInput.addEventListener(
      "change",
      updateFirstDeekshaIndicator
    );

    form.querySelector(
      ".cancel-maaladharan-edit"
    ).addEventListener(
      "click",
      () => refreshMaaladharanSection()
    );

    form.querySelector(
      ".withdraw-maaladharan-registration"
    ).addEventListener(
      "click",
      async () => {
        if (
          !window.confirm(
            "Withdraw this Maaladharan registration?"
          )
        ) {
          return;
        }

        await updateMaaladharanRegistration(
          form,
          {
            id: registrationId,
            action: "withdraw",
            memberNotes:
              form.elements.memberNotes.value
          }
        );
      }
    );

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        await updateMaaladharanRegistration(
          form,
          {
            id: registrationId,
            action: "update",
            maaladharanDate:
              form.elements
                .maaladharanDate.value,
            padiStatus:
              form.elements.padiStatus.value,
            irumudiOffering:
              form.elements.irumudiOffering.value,
            memberNotes:
              form.elements.memberNotes.value
          }
        );
      }
    );
  }


  async function updateMaaladharanRegistration(
    form,
    update
  ) {

    const buttons =
      form.querySelectorAll("button");

    const message =
      form.querySelector(
        ".maaladharan-edit-message"
      );

    buttons.forEach(button => {
      button.disabled = true;
    });

    message.className =
      "inline-message full-width maaladharan-edit-message";
    message.textContent =
      update.action === "withdraw"
        ? "Withdrawing registration..."
        : "Saving changes...";

    try {
      const response =
        await fetch(
          "/api/my-volunteers?resource=maaladharan",
          {
            method: "PATCH",
            credentials: "include",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify(update)
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Unable to update registration."
        );
      }

      currentMaaladharan = data;

      refreshMaaladharanSection();

    } catch (error) {
      console.error(error);

      message.className =
        "inline-message error full-width maaladharan-edit-message";
      message.textContent =
        error.message ||
        "Unable to update registration.";

      buttons.forEach(button => {
        button.disabled = false;
      });
    }
  }


  function refreshMaaladharanSection() {

    const section =
      document.getElementById(

    if (!section) {
      return;
    }

    section.outerHTML =
      renderMaaladharanSection(
        currentMaaladharan
      );

    setupMaaladharanForm();
  }

  function setupMaaladharanForm() {

    setupMaaladharanRegistrationActions();

    const form =
      document.getElementById(
        "maaladharanForm"
      );

    if (!form) {
      return;
    }

    const typeInput =
      form.elements.participantType;

    const nameInput =
      form.elements.participantName;

    const firstDeekshaInput =
      form.elements.firstDeeksha;

    const firstDeekshaIndicator =
      document.getElementById(
        "maaladharanFirstDeekshaIndicator"
      );

    const padiInput =
      form.elements.padiStatus;

    typeInput.addEventListener(
      "change",
      () => {
        if (typeInput.value === "primary") {
          nameInput.value =
            getCurrentFullName(currentMember);
          nameInput.readOnly = false;
        } else if (typeInput.value === "spouse") {
          nameInput.value =
            getCurrentSpouseName(currentMember);
          nameInput.readOnly = false;
        } else {
          nameInput.value = "";
          nameInput.focus();
        }
      }
    );

    const updateFirstDeekshaIndicator =
      () => {
        const isFirstDeeksha =
          padiInput.value ===
            "0 (Kanni Swamy)";

        firstDeekshaInput.checked =
          isFirstDeeksha;

        if (firstDeekshaIndicator) {
          firstDeekshaIndicator.hidden =
            !isFirstDeeksha;
        }
      };

    padiInput.addEventListener(
      "change",
      updateFirstDeekshaIndicator
    );

    updateFirstDeekshaIndicator();

    form.addEventListener(
      "submit",
      submitMaaladharanRegistration
    );
  }


  async function submitMaaladharanRegistration(
    event
  ) {

    event.preventDefault();

    const form =
      event.currentTarget;

    const button =
      document.getElementById(
        "submitMaaladharanButton"
      );

    const message =
      document.getElementById(
        "maaladharanFormMessage"
      );

    const formData =
      new FormData(form);

    const registration = {
      participantType:
        formData.get("participantType"),
      participantName:
        formData.get("participantName"),
      age:
        Number(formData.get("age")),
      phoneNumber:
        formData.get("phoneNumber"),
      maaladharanDate:
        formData.get("maaladharanDate"),
      firstDeeksha:
        form.elements.firstDeeksha.checked,
      padiStatus:
        formData.get("padiStatus"),
      irumudiOffering:
        formData.get("irumudiOffering"),
      memberNotes:
        formData.get("memberNotes")
    };

    button.disabled = true;
    button.textContent = "Registering...";
    message.className =
      "inline-message full-width";
    message.textContent = "";

    try {
      const response =
        await fetch(
          "/api/my-volunteers?resource=maaladharan",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify(registration)
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Unable to submit registration."
        );
      }

      currentMaaladharan = data;

      const section =
        document.getElementById(
          "maaladharanSection"
        );

      section.outerHTML =
        renderMaaladharanSection(
          currentMaaladharan
        );

      setupMaaladharanForm();

    } catch (error) {
      console.error(error);

      message.className =
        "inline-message error full-width";
      message.textContent =
        error.message ||
        "Unable to submit registration.";

      button.disabled = false;
      button.textContent =
        "Register Participant";
    }
  }

  async function saveVolunteers(event) {

    event.preventDefault();

    const button =
      document.getElementById(
        "saveVolunteersButton"
      );

    button.disabled = true;
    button.textContent = "Saving...";

    try {
      const volunteers =
        collectVolunteerFormValues();

      const response =
        await fetch(
          "/api/update-volunteers",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body:
              JSON.stringify({
                volunteers
              })
          }
        );

      if (!response.ok) {
        throw new Error(
          "Unable to update volunteers."
        );
      }

      const data =
        await response.json();

      currentVolunteers =
        Array.isArray(data.volunteers)
          ? data.volunteers
          : [];

      restoreVolunteerSection();

    } catch (error) {
      console.error(error);

      alert(
        "Unable to update volunteering right now. Please try again."
      );

      button.disabled = false;
      button.textContent = "Save";
    }
  }


  function collectVolunteerFormValues() {

    return Array.from(
      document.querySelectorAll(
        ".volunteer-form-row"
      )
    ).map(row => {

      const type =
        row.dataset.volunteerType;

      const areas =
        Array.from(
          row.querySelectorAll(
            ".volunteer-area:checked"
          )
        ).map(input =>
          input.value
        );

      return {
        id:
          row.dataset.volunteerId || null,
        memberType:
          type,
        name:
          type === "additional"
            ? row.querySelector(".additional-name")?.value || ""
            : "",
        relationship:
          type === "additional"
            ? row.querySelector(".additional-relationship")?.value || ""
            : "",
        interested:
          Boolean(
            row.querySelector(".volunteer-interested")?.checked
          ),
        areas
      };
    });
  }

  function setupHomePoojaAdmin(
    calendarDates = []
  ) {
    const container =
      document.getElementById(
        "homePoojaAdminContent"
      );

    const blockForm =
      document.getElementById(
        "homePoojaBlockForm"
      );

    if (!container || !blockForm) {
      return;
    }

    setupHomePoojaCalendar(
      calendarDates,
      { adminControls: true }
    );

    blockForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const values =
          new FormData(blockForm);

        await submitHomePoojaAdminAction(
          "POST",
          {
            poojaDate: values.get("poojaDate"),
            blockReason: values.get("blockReason")
          }
        );
      }
    );

    container.addEventListener(
      "submit",
      async event => {
        const bookingEditForm = event.target.closest(
          ".home-pooja-booking-edit-form"
        );

        if (bookingEditForm) {
          event.preventDefault();
          const row = bookingEditForm.closest(
            "[data-home-pooja-id]"
          );
          const values = new FormData(bookingEditForm);

          await submitHomePoojaAdminAction(
            "PATCH",
            {
              id: Number(row.dataset.homePoojaId),
              action: "edit-booking",
              preferredTime: values.get("preferredTime"),
              poojaAddress: values.get("poojaAddress")
            }
          );

          return;
        }

        const editForm = event.target.closest(
          ".home-pooja-block-edit-form"
        );

        if (!editForm) {
          return;
        }

        event.preventDefault();
        const values = new FormData(editForm);

        await submitHomePoojaAdminAction(
          "PATCH",
          {
            action: "edit-block",
            originalDate: editForm.dataset.originalDate,
            poojaDate: values.get("poojaDate"),
            blockReason: values.get("blockReason")
          }
        );
      }
    );

    container.addEventListener(
      "click",
      async event => {
        const button =
          event.target.closest(
            "button[data-action]"
          );

        if (!button) {
          return;
        }

        if (button.dataset.action === "edit-booking") {
          const row = button.closest("[data-home-pooja-id]");
          const editForm = row?.querySelector(
            ".home-pooja-booking-edit-form"
          );

          if (editForm) {
            editForm.hidden = false;
            editForm.querySelector(
              'input[name="preferredTime"]'
            )?.focus();
          }

          return;
        }

        if (button.dataset.action === "cancel-booking-edit") {
          const editForm = button.closest(
            ".home-pooja-booking-edit-form"
          );

          if (editForm) {
            editForm.hidden = true;
          }

          return;
        }

        if (button.dataset.action === "edit-block") {
          const row = button.closest("[data-block-date]");
          const editForm = row?.querySelector(
            ".home-pooja-block-edit-form"
          );

          if (editForm) {
            editForm.hidden = false;
            editForm.querySelector(
              'input[name="poojaDate"]'
            )?.focus();
          }

          return;
        }

        if (button.dataset.action === "cancel-block-edit") {
          const editForm = button.closest(
            ".home-pooja-block-edit-form"
          );

          if (editForm) {
            editForm.hidden = true;
          }

          return;
        }

        if (
          button.dataset.action ===
          "unblock-date"
        ) {
          const poojaDate =
            button.dataset.poojaDate;

          if (!window.confirm(
            "Make this date available for Home Pooja booking?"
          )) {
            return;
          }

          await submitHomePoojaAdminAction(
            "PATCH",
            {
              action: "unblock-date",
              poojaDate
            }
          );

          return;
        }

        const row =
          button.closest(
            "[data-home-pooja-id]"
          );

        const note =
          row.querySelector(".admin-note");

        await submitHomePoojaAdminAction(
          "PATCH",
          {
            id: Number(
              row.dataset.homePoojaId
            ),
            action:
              button.dataset.action,
            adminNotes:
              note?.value || ""
          }
        );
      }
    );
  }


  async function submitHomePoojaAdminAction(
    method,
    payload
  ) {
    const response =
      await fetch(
        "/api/admin-members?resource=home-pooja",
        {
          method,
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      const message =
        document.getElementById(
          "homePoojaAdminMessage"
        );

      if (message) {
        message.className =
          "inline-message error";
        message.textContent =
          data.message ||
          "Unable to update the request.";
      }

      return;
    }

    await loadHomePoojaAdmin();
  }

  function setupRegisteredSwamiesSorting() {
    const table =
      document.getElementById(
        "registeredSwamiesTable"
      );

    if (!table) {
      return;
    }

    const body = table.tBodies[0];
    const buttons =
      table.querySelectorAll(
        ".swamy-sort-button"
      );

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        const key = button.dataset.sortKey;
        const previousKey = table.dataset.sortKey;
        const previousDirection =
          table.dataset.sortDirection;
        const direction =
          previousKey === key &&
          previousDirection === "asc"
            ? "desc"
            : "asc";

        const rows =
          Array.from(body.rows);

        rows.sort((first, second) => {
          const firstValue = first.dataset[key] || "";
          const secondValue = second.dataset[key] || "";
          const numeric =
            key === "age" || key === "padi";
          const comparison = numeric
            ? (parseInt(firstValue, 10) || 0) -
              (parseInt(secondValue, 10) || 0)
            : firstValue.localeCompare(
                secondValue,
                undefined,
                { sensitivity: "base" }
              );

          return direction === "asc"
            ? comparison
            : -comparison;
        });

        rows.forEach(row => body.appendChild(row));
        table.dataset.sortKey = key;
        table.dataset.sortDirection = direction;

        buttons.forEach(item => {
          const indicator =
            item.querySelector(".sort-indicator");
          indicator.textContent =
            item === button
              ? direction === "asc"
                ? " ▲"
                : " ▼"
              : "";
          item.closest("th").setAttribute(
            "aria-sort",
            item === button
              ? direction === "asc"
                ? "ascending"
                : "descending"
              : "none"
          );
        });
      });
    });
  }


  function renderCountChart({
    title,
    subtitle,
    items,
    emptyMessage
  }) {

    const values =
      Array.isArray(items)
        ? items
        : [];

    if (values.length === 0) {
      return `
        <div class="trend-card">
          <h3>${escapeHtml(title)}</h3>

          <div class="trend-subtitle">
            ${escapeHtml(subtitle)}
          </div>

          <div class="directory-empty">
            ${escapeHtml(emptyMessage)}
          </div>
        </div>
      `;
    }

    const maxCount =
      Math.max(
        ...values.map(item =>
          Number(item.count || 0)
        ),
        1
      );

    const chartWidth =
      Math.max(
        520,
        values.length * 58
      );

    const bars =
      values.map(item => {

        const count =
          Number(item.count || 0);

        const percentage =
          count === 0
            ? 1
            : Math.max(
                3,
                Math.round(
                  (count / maxCount) * 100
                )
              );

        return `
          <div class="trend-column">
            <div class="trend-count">
              ${count}
            </div>

            <div class="trend-bar-area">
              <div
                class="trend-bar"
                style="height:${percentage}%"
                title="${escapeHtml(
                  item.label
                )}: ${count}"
              ></div>
            </div>

            <div class="trend-label">
              ${escapeHtml(item.label)}
            </div>
          </div>
        `;
      }).join("");

    return `
      <div class="trend-card">
        <h3>${escapeHtml(title)}</h3>

        <div class="trend-subtitle">
          ${escapeHtml(subtitle)}
        </div>

        <div class="trend-chart-scroll">
          <div
            class="trend-chart"
            style="min-width:${chartWidth}px"
          >
            ${bars}
          </div>
        </div>
      </div>
    `;
  }
