  function requestInlineConfirmation(
    button,
    {
      confirmText,
      resetText,
      ariaLabel,
      timeout = 10000
    }
  ) {
    if (button.dataset.confirming === "true") {
      delete button.dataset.confirming;
      return true;
    }

    button.dataset.confirming = "true";
    button.textContent = confirmText;
    button.setAttribute("aria-label", ariaLabel);

    setTimeout(() => {
      if (
        button.isConnected &&
        button.dataset.confirming === "true"
      ) {
        delete button.dataset.confirming;
        button.textContent = resetText;
        button.removeAttribute("aria-label");
      }
    }, timeout);

    return false;
  }


  function setupMaaladharanRegistrationActions() {

    document
      .querySelectorAll(
        ".edit-maaladharan-button"
      )
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            const registration =
              currentMaaladharan
                ?.registrations
                ?.find(item =>
                  String(item.id) ===
                    String(
                      button.dataset
                        .registrationId
                    )
                );

            if (!registration) {
              return;
            }

            const container =
              document.getElementById(
                `maaladharanRegistration-${registration.id}`
              );

            if (!container) {
              return;
            }

            container.insertAdjacentHTML(
              "beforeend",
              renderMaaladharanEditForm(
                registration
              )
            );

            button.disabled = true;

            setupMaaladharanEditForm(
              container.querySelector(
                ".maaladharan-edit-form"
              )
            );
          }
        );
      });
  }


  function setupMaaladharanEditForm(form) {

    if (!form) {
      return;
    }

    const registrationId =
      form.dataset.registrationId;

    const padiInput =
      form.elements.padiStatus;

    const firstDeekshaIndicator =
      form.querySelector(
        ".first-deeksha-edit-indicator"
      );

    const firstDeekshaCheckbox =
      form.querySelector(
        ".first-deeksha-edit-checkbox"
      );

    const updateFirstDeekshaIndicator =
      () => {
        const isFirstDeeksha =
          padiInput.value ===
            "0 (Kanni Swamy)";

        if (firstDeekshaIndicator) {
          firstDeekshaIndicator.hidden =
            !isFirstDeeksha;
        }

        if (firstDeekshaCheckbox) {
          firstDeekshaCheckbox.checked =
            isFirstDeeksha;
        }
      };

    padiInput.addEventListener(
      "change",
      updateFirstDeekshaIndicator
    );

    form.querySelector(
      ".cancel-maaladharan-edit"
    ).addEventListener(
      "click",
      () => refreshMaaladharanSection()
    );

    form.querySelector(
      ".withdraw-maaladharan-registration"
    ).addEventListener(
      "click",
      async event => {
        const button = event.currentTarget;

        if (!requestInlineConfirmation(button, {
          confirmText: "Confirm Withdrawal",
          resetText: "Withdraw Registration",
          ariaLabel: "Confirm Maaladharan registration withdrawal"
        })) {
          return;
        }

        button.disabled = true;
        button.textContent = "Withdrawing…";

        await updateMaaladharanRegistration(
          form,
          {
            id: registrationId,
            action: "withdraw",
            memberNotes:
              form.elements.memberNotes.value
          }
        );

        if (button.isConnected) {
          button.disabled = false;
          button.textContent = "Withdraw Registration";
          button.removeAttribute("aria-label");
        }
      }
    );

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        await updateMaaladharanRegistration(
          form,
          {
            id: registrationId,
            action: "update",
            maaladharanDate:
              form.elements
                .maaladharanDate.value,
            padiStatus:
              form.elements.padiStatus.value,
            irumudiOffering:
              form.elements.irumudiOffering.value,
            memberNotes:
              form.elements.memberNotes.value
          }
        );
      }
    );
  }


  async function updateMaaladharanRegistration(
    form,
    update
  ) {

    const buttons =
      form.querySelectorAll("button");

    const message =
      form.querySelector(
        ".maaladharan-edit-message"
      );

    buttons.forEach(button => {
      button.disabled = true;
    });

    message.className =
      "inline-message full-width maaladharan-edit-message";
    message.textContent =
      update.action === "withdraw"
        ? "Withdrawing registration..."
        : "Saving changes...";

    try {
      const response =
        await fetch(
          "/api/my-volunteers?resource=maaladharan",
          {
            method: "PATCH",
            credentials: "include",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify(update)
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Unable to update registration."
        );
      }

      currentMaaladharan = data;

      refreshMaaladharanSection();

    } catch (error) {
      console.error(error);

      message.className =
        "inline-message error full-width maaladharan-edit-message";
      message.textContent =
        error.message ||
        "Unable to update registration.";

      buttons.forEach(button => {
        button.disabled = false;
      });
    }
  }

    section.outerHTML =
      renderMaaladharanSection(
        currentMaaladharan
      );

    setupMaaladharanForm();
  }

      "change",

  async function submitMaaladharanRegistration(
    event
  ) {

    event.preventDefault();

    const form =
      event.currentTarget;

    const button =
      document.getElementById(
        "submitMaaladharanButton"
      );

    const message =
      document.getElementById(
        "maaladharanFormMessage"
      );

    const formData =
      new FormData(form);

    const registration = {
      participantType:
        formData.get("participantType"),
      participantName:
        formData.get("participantName"),
      age:
        Number(formData.get("age")),
      phoneNumber:
        formData.get("phoneNumber"),
      maaladharanDate:
        formData.get("maaladharanDate"),
      firstDeeksha:
        form.elements.firstDeeksha.checked,
      padiStatus:
        formData.get("padiStatus"),
      irumudiOffering:
        formData.get("irumudiOffering"),
      memberNotes:
        formData.get("memberNotes")
    };

    button.disabled = true;
    button.textContent = "Registering...";
    message.className =
      "inline-message full-width";
    message.textContent = "";

    try {
      const response =
        await fetch(
          "/api/my-volunteers?resource=maaladharan",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify(registration)
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||

      currentMaaladharan = data;

      const section =
        document.getElementById(

      message.textContent =
        error.message ||
        "Unable to submit registration.";

      button.disabled = false;
      button.textContent =
        "Register Participant";
    }
  }

  function setupPortalNavigation() {
    const buttons = Array.from(
      document.querySelectorAll("[data-portal-target]")
    );
    const panels = Array.from(
      document.querySelectorAll("[data-portal-panel]")
    );
    const selector =
      document.getElementById("portalSectionSelect");

    if (!buttons.length || !panels.length || !selector) {
      return;
    }

    const availableSections = new Set(
      panels.map(panel => panel.dataset.portalPanel)
    );

    const showSection = section => {
      const target = availableSections.has(section)
        ? section
        : "overview";

      panels.forEach(panel => {
        panel.hidden =
          panel.dataset.portalPanel !== target;
      });
      buttons.forEach(button => {
        const active =
          button.dataset.portalTarget === target;
        button.classList.toggle("active", active);
        button.setAttribute(
          "aria-current",
          active ? "page" : "false"
        );
      });
      selector.value = target;
      window.history.replaceState(
        null,
        "",
        `#${target}`
      );
    };

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        showSection(button.dataset.portalTarget);
      });
    });

    selector.addEventListener("change", () => {
      showSection(selector.value);
    });

    showSection(
      window.location.hash.slice(1) || "overview"
    );
  }

  function setupHomePoojaAdmin(
    calendarDates = []
  ) {
    const container =
      document.getElementById(
        "homePoojaAdminContent"
      );

    const blockForm =
      document.getElementById(
        "homePoojaBlockForm"
      );

    const availabilityForm =
      document.getElementById(
        "homePoojaAvailabilityForm"
      );

    if (!container || !blockForm || !availabilityForm) {
      return;
    }

    setupHomePoojaCalendar(
      calendarDates,
      { adminControls: true }
    );
    setupHomePoojaInvitations("homePoojaAdminContent");

    blockForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const values =
          new FormData(blockForm);

        await submitHomePoojaAdminAction(
          "POST",
          {
            poojaDate: values.get("poojaDate"),
            blockReason: values.get("blockReason")
          }
        );
      }
    );

    availabilityForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();
        const values = new FormData(availabilityForm);

        await submitHomePoojaAdminAction(
          "POST",
          {
            action: "add-availability",
            poojaDate: values.get("poojaDate"),
            preferredTime: values.get("preferredTime")
          }
        );
      }
    );

    container.addEventListener(
      "submit",
      async event => {
        const availabilityEditForm = event.target.closest(
          ".home-pooja-availability-edit-form"
        );

        if (availabilityEditForm) {
          event.preventDefault();
          const values = new FormData(availabilityEditForm);

          await submitHomePoojaAdminAction(
            "PATCH",
            {
              action: "edit-availability",
              originalDate: availabilityEditForm.dataset.originalDate,
              poojaDate: values.get("poojaDate"),
              preferredTime: values.get("preferredTime")
            }
          );
          return;
        }

        const bookingEditForm = event.target.closest(
          ".home-pooja-booking-edit-form"
        );

        if (bookingEditForm) {
          event.preventDefault();
          const row = bookingEditForm.closest(
            "[data-home-pooja-id]"
          );
          const values = new FormData(bookingEditForm);

          await submitHomePoojaAdminAction(
            "PATCH",
            {
              id: Number(row.dataset.homePoojaId),
              action: "edit-booking",
              preferredTime: values.get("preferredTime"),
              poojaAddress: values.get("poojaAddress")
            }
          );

          return;
        }

        const editForm = event.target.closest(
          ".home-pooja-block-edit-form"
        );

        if (!editForm) {
          return;
        }

        event.preventDefault();
        const values = new FormData(editForm);

        await submitHomePoojaAdminAction(
          "PATCH",
          {
            action: "edit-block",
            originalDate: editForm.dataset.originalDate,
            poojaDate: values.get("poojaDate"),
            blockReason: values.get("blockReason")
          }
        );
      }
    );

    container.addEventListener(
      "click",
      async event => {
        const button =
          event.target.closest(
            "button[data-action]"
          );

        if (!button) {
          return;
        }

        if (button.dataset.action === "edit-calendar-availability") {
          const editForm = document.getElementById(
            "homePoojaCalendarAvailabilityEditor"
          );
          const date = button.dataset.poojaDate || "";

          editForm.dataset.originalDate = date;
          editForm.elements.poojaDate.value = date;
          editForm.elements.preferredTime.value =
            button.dataset.poojaTime || "";
          editForm.hidden = false;
          editForm.scrollIntoView({ behavior: "smooth", block: "nearest" });
          editForm.elements.preferredTime.focus();
          return;
        }

        if (button.dataset.action === "cancel-availability-edit") {
          const editForm = button.closest(
            ".home-pooja-availability-edit-form"
          );
          if (editForm) {
            editForm.hidden = true;
          }
          return;
        }

        if (button.dataset.action === "remove-availability") {
          if (!requestInlineConfirmation(button, {
            confirmText: "Confirm Remove",
            resetText: "Remove",
            ariaLabel: "Confirm removal from Home Pooja availability"
          })) {
            return;
          }

          button.disabled = true;
          button.textContent = "Removing…";

          await submitHomePoojaAdminAction(
            "PATCH",
            {
              action: "remove-availability",
              poojaDate: button.dataset.poojaDate
            }
          );

          if (button.isConnected) {
            button.disabled = false;
            button.textContent = "Remove";
            button.removeAttribute("aria-label");
          }
          return;
        }

        if (button.dataset.action === "block-available-date") {
          const date = button.dataset.poojaDate || "";
          blockForm.elements.poojaDate.value = date;
          blockForm.scrollIntoView({ behavior: "smooth", block: "nearest" });
          blockForm.elements.blockReason.focus();
          return;
        }

        if (button.dataset.action === "edit-booking") {
          const row = button.closest("[data-home-pooja-id]");
          const editForm = row?.querySelector(
            ".home-pooja-booking-edit-form"
          );

          if (editForm) {
            editForm.hidden = false;
            editForm.querySelector(
              'input[name="preferredTime"]'
            )?.focus();
          }

          return;
        }

        if (button.dataset.action === "cancel-booking-edit") {
          const editForm = button.closest(
            ".home-pooja-booking-edit-form"
          );

          if (editForm) {
            editForm.hidden = true;
          }

          return;
        }

        if (button.dataset.action === "cancel-booking") {
          const row = button.closest("[data-home-pooja-id]");

          if (!row) {
            return;
          }

          if (button.dataset.confirming !== "true") {
            button.dataset.confirming = "true";
            button.textContent = "Confirm Cancel Booking";
            button.setAttribute(
              "aria-label",
              "Confirm cancellation and return this date to availability"
            );

            setTimeout(() => {
              if (
                button.isConnected &&
                button.dataset.confirming === "true"
              ) {
                delete button.dataset.confirming;
                button.textContent = "Cancel Booking";
                button.removeAttribute("aria-label");
              }
            }, 10000);
            return;
          }

          delete button.dataset.confirming;
          button.textContent = "Cancelling…";
          button.disabled = true;

          await submitHomePoojaAdminAction(
            "PATCH",
            {
              id: Number(row.dataset.homePoojaId),
              action: "cancel-booking",
              adminNotes:
                "Booking cancelled by Board/Admin"
            }
          );

          if (button.isConnected) {
            button.disabled = false;
            button.textContent = "Cancel Booking";
            button.removeAttribute("aria-label");
          }
          return;
        }

        if (button.dataset.action === "send-cancellation-email") {
          const row = button.closest("[data-home-pooja-id]");

          if (!row || !requestInlineConfirmation(button, {
            confirmText: "Confirm Send Email",
            resetText: "Send Cancellation Email",
            ariaLabel: "Confirm cancellation email delivery"
          })) {
            return;
          }

          button.disabled = true;
          button.textContent = "Sending…";

          await submitHomePoojaAdminAction(
            "PATCH",
            {
              id: Number(row.dataset.homePoojaId),
              action: "send-cancellation-email"
            }
          );

          if (button.isConnected) {
            button.disabled = false;
            button.textContent = "Send Cancellation Email";
            button.removeAttribute("aria-label");
          }
          return;
        }

        if (button.dataset.action === "edit-block") {
          const row = button.closest("[data-block-date]");
          const editForm = row?.querySelector(
            ".home-pooja-block-edit-form"
          );

          if (editForm) {
            editForm.hidden = false;
            editForm.querySelector(
              'input[name="poojaDate"]'
            )?.focus();
          }

          return;
        }

        if (button.dataset.action === "cancel-block-edit") {
          const editForm = button.closest(
            ".home-pooja-block-edit-form"
          );

          if (editForm) {
            editForm.hidden = true;
          }

          return;
        }

        if (
          button.dataset.action ===
          "unblock-date"
        ) {
          const poojaDate =
            button.dataset.poojaDate;

          if (!poojaDate) {
            return;
          }

          if (button.dataset.confirming !== "true") {
            button.dataset.confirming = "true";
            button.textContent = "Confirm Unblock";
            button.setAttribute(
              "aria-label",
              "Confirm unblock and make this date available"
            );

            setTimeout(() => {
              if (
                button.isConnected &&
                button.dataset.confirming === "true"
              ) {
                delete button.dataset.confirming;
                button.textContent = "Unblock";
                button.removeAttribute("aria-label");
              }
            }, 10000);
            return;
          }

          delete button.dataset.confirming;
          button.textContent = "Unblocking…";
          button.disabled = true;

          await submitHomePoojaAdminAction(
            "PATCH",
            {
              action: "unblock-date",
              poojaDate
            }
          );

          if (button.isConnected) {
            button.disabled = false;
            button.textContent = "Unblock";
            button.removeAttribute("aria-label");
          }
          return;
        }

        const row =
          button.closest(
            "[data-home-pooja-id]"
          );

        const note =
          row.querySelector(".admin-note");

        await submitHomePoojaAdminAction(
          "PATCH",
          {
            id: Number(
              row.dataset.homePoojaId
            ),
            action:
              button.dataset.action,
            adminNotes:
              note?.value || ""
          }
        );
      }
    );
  }


  async function submitHomePoojaAdminAction(
    method,
    payload
  ) {
    const response =
      await fetch(
        "/api/admin-members?resource=home-pooja",
        {
          method,
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      const message =
        document.getElementById(
          "homePoojaAdminMessage"
        );

      if (message) {
        message.className =
          "inline-message error";
        message.textContent =
          data.message ||
          "Unable to update the request.";
      }

      return;
    }

    await loadHomePoojaAdmin();
  }

  function setupRegisteredSwamiesSorting() {
    const table =
      document.getElementById(
        "registeredSwamiesTable"
      );

    if (!table) {
      return;
    }

    const body = table.tBodies[0];
    const buttons =
      table.querySelectorAll(
        ".swamy-sort-button"
      );

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        const key = button.dataset.sortKey;
        const previousKey = table.dataset.sortKey;
        const previousDirection =
          table.dataset.sortDirection;
        const direction =
          previousKey === key &&
          previousDirection === "asc"
            ? "desc"
            : "asc";

        const rows =
          Array.from(body.rows);

        rows.sort((first, second) => {
          const firstValue = first.dataset[key] || "";
          const secondValue = second.dataset[key] || "";
          const numeric =
            key === "age" || key === "padi";
          const comparison = numeric
            ? (parseInt(firstValue, 10) || 0) -
              (parseInt(secondValue, 10) || 0)
            : firstValue.localeCompare(
                secondValue,
                undefined,
                { sensitivity: "base" }
              );

          return direction === "asc"
            ? comparison
            : -comparison;
        });

        rows.forEach(row => body.appendChild(row));
        table.dataset.sortKey = key;
        table.dataset.sortDirection = direction;

        buttons.forEach(item => {
          const indicator =
            item.querySelector(".sort-indicator");
          indicator.textContent =
            item === button
              ? direction === "asc"
                ? " ▲"
                : " ▼"
              : "";
          item.closest("th").setAttribute(
            "aria-sort",
            item === button
              ? direction === "asc"
                ? "ascending"
                : "descending"
              : "none"
          );
        });
      });
    });
  }

            ${escapeHtml(emptyMessage)}
          </div>
        </div>
      `;
    }

    const maxCount =
      Math.max(
        ...values.map(item =>
          Number(item.count || 0)
        ),
        1
      );

    const chartWidth =
      Math.max(
        520,
        values.length * 58
      );

    const bars =
      values.map(item => {

        const count =
          Number(item.count || 0);

        const percentage =
          count === 0
            ? 1
            : Math.max(
                3,
                Math.round(
                  (count / maxCount) * 100
                )
              );

        return `
          <div class="trend-column">
            <div class="trend-count">
              ${count}
            </div>

            <div class="trend-bar-area">
              <div
                class="trend-bar"
                style="height:${percentage}%"
                title="${escapeHtml(
                  item.label
                )}: ${count}"
              ></div>
            </div>

            <div class="trend-label">
              ${escapeHtml(item.label)}
            </div>
          </div>
        `;
      }).join("");

    return `
      <div class="trend-card">
        <h3>${escapeHtml(title)}</h3>

        <div class="trend-subtitle">
          ${escapeHtml(subtitle)}
        </div>

        <div class="trend-chart-scroll">
          <div
            class="trend-chart"
            style="min-width:${chartWidth}px"
          >
            ${bars}
          </div>
        </div>
      </div>
    `;
  }

  async function loadMemberDirectory(
    page = 1
  ) {

    const container =
      document.getElementById(
        "directoryResults"
      );


    if (!container) {
      return;
    }


    container.innerHTML = `

      <div class="directory-empty">
        Loading members...
      </div>
    `;


    try {

      const params =
        new URLSearchParams();


      params.set(
        "page",
        page
      );


      params.set(
        "size",
        20
      );

      params.set(
        "sort",
        directorySortBy
      );


      if (
        directorySearchQuery
      ) {

        params.set(
          "q",
          directorySearchQuery
        );
      }


      const response =
        await fetch(

          `/api/admin-members?${params.toString()}`,

          {
            method: "GET",
            credentials: "include"
          }
        );


      if (
        response.status === 403
      ) {

        container.innerHTML = `

          <div class="directory-empty error">
            Board or administrator access required.
          </div>
        `;

        return;
      }


      if (!response.ok) {

        throw new Error(
          "Unable to load directory."
        );
      }


      const data =
        await response.json();


      const directory =
        data.directory || {};


      const members =
        Array.isArray(
          directory.members
        )
          ? directory.members
          : [];


      directoryCurrentPage =
        directory.page || 1;


      if (
        members.length === 0
      ) {

        container.innerHTML = `

          <div class="directory-empty">
            No members found.
          </div>
        `;

        return;
      }


      const memberCards =
        members.map(member => {


          const fullName =
            `${member.firstName || ""} ${member.lastName || ""}`
              .trim();


          const spouseName =
            `${member.spouseFirstName || ""} ${member.spouseLastName || ""}`
              .trim();


          return `

            <div class="member-card">


              <div class="member-card-header">


                <div>

                  <div class="member-name">
                    ${escapeHtml(
                      fullName ||
                      "AAYSSA Member"

                  <div class="member-meta">

                ${

                        ${

                            ? `

                              <span class="status-badge">
                                ${escapeHtml(member.status)}
                              </span>

                            `

                            : ""
                        }

                      </div>
                    `

                    : ""
                }

              </div>



              <div class="member-detail-grid">


                <div class="member-detail">

                  <span class="label">
                    Email
                  </span>

                  <div class="value">
                    ${displayValue(member.email)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Mobile
                  </span>

                  <div class="value">
                    ${displayValue(member.mobileNumber)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Spouse
                  </span>

                  <div class="value">
                    ${displayValue(spouseName)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Family
                  </span>

                  <div class="value">

                    ${member.noOfAdults ?? 0}
                    Adults /

                    ${member.noOfKids ?? 0}
                    Kids

                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Address
                  </span>

                  <div class="value">
                    ${displayValue(member.address)}
                  </div>

                </div>



                <div class="member-detail">

                  <span class="label">
                    Seva Volunteers
                  </span>

                  ${renderDirectoryVolunteers(
                    member.volunteers
                  )}

                </div>

              </div>

            </div>
          `;

        }).join("");


      container.innerHTML = `

        <div class="directory-results">
          ${memberCards}
        </div>


        <div class="pagination">


          <button
            class="page-button"
            id="directoryPrevious"
            ${
              directory.hasPreviousPage
                ? ""
                : "disabled"
            }
          >
            Previous
          </button>


          <span class="page-info">

            Page
            ${directory.page || 1}

            of

            ${directory.totalPages || 1}

            &nbsp;•&nbsp;

            ${directory.total || 0}
            Families

          </span>


          <button
            class="page-button"
            id="directoryNext"
            ${
              directory.hasNextPage
                ? ""
                : "disabled"
            }
          >
            Next
          </button>

        </div>
      `;


      const previous =
        document.getElementById(
          "directoryPrevious"
        );


      const next =
        document.getElementById(
          "directoryNext"
        );


      if (previous) {

        previous.addEventListener(
          "click",
          () =>
            loadMemberDirectory(
              directoryCurrentPage - 1
            )
        );
      }


      if (next) {

        next.addEventListener(
          "click",
          () =>
            loadMemberDirectory(
              directoryCurrentPage + 1
            )
        );
      }


    } catch (error) {

      console.error(
        "Directory error:",
        error
      );


      container.innerHTML = `

        <div class="directory-empty error">
          Unable to load member directory right now.
        </div>
      `;
    }

  function setupAdminDashboardTabs() {
    const tabs = Array.from(
      document.querySelectorAll("[data-admin-dashboard-tab]")
    );
    const panels = Array.from(
      document.querySelectorAll("[data-admin-dashboard-panel]")
    );

    if (!tabs.length || !panels.length) {
      return;
    }

    const selectPanel = target => {
      tabs.forEach(tab => {
        const selected = tab.dataset.adminDashboardTab === target;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });

      panels.forEach(panel => {
        panel.hidden = panel.dataset.adminDashboardPanel !== target;
      });
    };

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const target = tab.dataset.adminDashboardTab;
        selectPanel(target);

        if (target === "capacity") {
          loadCapacityMonitor();
        }
      });
    });

    selectPanel("overview");
  }

  let capacityMonitorLoaded = false;

  async function loadCapacityMonitor(force = false) {
    const container = document.getElementById("capacityMonitorContent");

    if (!container || (capacityMonitorLoaded && !force)) {
      return;
    }

    container.innerHTML = '<div class="dashboard-loading">Checking current service usage…</div>';

    try {
      const response = await fetch(
        "/api/admin-stats?resource=capacity-dashboard",
        {
          method: "GET",
          credentials: "include"
        }
      );
      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.message || "Unable to load capacity statistics.");
      }

      const capacity = data.capacity || {};
      const checks = Array.isArray(capacity.checks) ? capacity.checks : [];
      const severity = ["warning", "critical"].includes(capacity.severity)
        ? capacity.severity
        : "ok";
      const summary = severity === "critical"
        ? "One or more services need immediate attention."
        : severity === "warning"
          ? "One or more services are approaching a configured limit."
          : "All automatically measured services are within their configured thresholds.";

      container.innerHTML = `
        <div class="capacity-monitor-header">
          <div>
            <h3>Free-Tier Capacity Monitor</h3>
            <p>Last checked ${escapeHtml(formatCapacityCheckedAt(capacity.checkedAt))}</p>
          </div>
          <button class="secondary-button capacity-refresh" type="button"
            id="capacityRefreshButton">Refresh now</button>
        </div>
        <div class="capacity-summary ${severity}">
          <span aria-hidden="true">${severity === "ok" ? "✓" : "⚠"}</span>
          <span>${escapeHtml(summary)}</span>
        </div>
        <div class="capacity-grid">
          ${checks.map(renderCapacityCheck).join("")}
        </div>
        <p class="capacity-note">
          Warning threshold: ${Number(capacity.thresholds?.warning || 70)}%.
          Critical threshold: ${Number(capacity.thresholds?.critical || 90)}%.
          Dashboard-only items are shown as Manual Check and are not estimated.
        </p>
      `;

      capacityMonitorLoaded = true;
      document.getElementById("capacityRefreshButton")
        ?.addEventListener("click", () => loadCapacityMonitor(true));
    } catch (error) {
      container.innerHTML = `
        <div class="directory-empty error">
          ${escapeHtml(error?.message || "Unable to load capacity statistics.")}
        </div>
      `;
    }
  }

  function renderCapacityCheck(check) {
    const status = ["ok", "warning", "critical", "error", "manual"].includes(check?.status)
      ? check.status
      : "manual";
    const hasUsage = Number.isFinite(Number(check?.percent));
    const percent = hasUsage
      ? Math.max(0, Math.min(100, Number(check.percent)))
      : 0;
    const label = status === "manual" ? "Manual Check" : status;

    return `
      <article class="capacity-card ${status}">
        <div class="capacity-card-heading">
          <div>
            <strong>${escapeHtml(check?.provider || "Service")}</strong>
            <small>${escapeHtml(check?.metric || "Capacity")}</small>
          </div>
          <span class="capacity-status">${escapeHtml(label)}</span>
        </div>
        ${hasUsage ? `
          <div class="capacity-progress" role="progressbar"
            aria-label="${escapeHtml(check?.provider || "Service")} ${escapeHtml(check?.metric || "Capacity")}"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}">
            <span style="width:${percent}%"></span>
          </div>
          <div class="capacity-usage">
            <span>${Number(check.used).toLocaleString()} of ${Number(check.limit).toLocaleString()}</span>
            <strong>${percent.toFixed(1)}%</strong>
          </div>
        ` : `
          <p class="capacity-detail">${escapeHtml(check?.detail || "Usage details unavailable.")}</p>
        `}
      </article>
    `;
  }

  function formatCapacityCheckedAt(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime())
      ? "just now"
      : date.toLocaleString();
  }


  async function loadDashboardStats() {

    const container =

      );


    if (!container) {

    }


    try {

            credentials: "include"
          }
        );

          <button class="admin-dashboard-tab" type="button" role="tab"
            data-admin-dashboard-tab="members" aria-selected="false">

          <button class="admin-dashboard-tab" type="button" role="tab"

        <section class="admin-dashboard-panel"

        <div class="stats-grid">


          <div class="stat-card">

            <div class="stat-number">
              ${stats.registeredFamilies ?? 0}

            <div class="stat-label">

            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalPeople ?? 0}
            </div>

            <div class="stat-label">
              Total People
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalAdults ?? 0}
            </div>

            <div class="stat-label">
              Adults
            </div>

          </div>



          <div class="stat-card">

            <div class="stat-number">
              ${stats.totalKids ?? 0}

            </div>

          <div class="stat-card">

            <div class="stat-number">

            <div class="stat-label">
              Donations This Year
            </div>

          </div>

        </div>



        <div class="dashboard-grid">


          <div class="dashboard-card">

            <h3>
              Seva Areas of Interest
            </h3>


            ${[
              "Pooja",
              "Annadhanam",

  /* =====================================================
     LOGOUT
     ===================================================== */

  async function logout() {

    const button =
      document.getElementById(
        "logoutButton"
      );


    if (button) {

      button.disabled = true;

      button.textContent =
        "Logging out...";
    }


    try {

      const response =
        await fetch(

          "/api/logout",

          {
            method: "POST",
            credentials: "include"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Logout failed"
        );
      }


      window.location.href =
        "https://atlantaayyappasevasangam.org/";


    } catch (error) {

      console.error(error);


      if (button) {

        button.disabled = false;

        button.textContent =
          "Logout";
      }


      alert(
        "Unable to log out right now. Please try again."
      );
    }
  }



  /* =====================================================
     START PORTAL
     ===================================================== */

  if (document.documentElement.classList.contains("portal-embedded")) {
    let lastReportedHeight = 0;
    let resizeFrame = 0;

    const reportEmbeddedHeight = () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        const height = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight
        );

        if (Math.abs(height - lastReportedHeight) < 2) {
          return;
        }

        lastReportedHeight = height;
        window.parent.postMessage(
          {
            type: "aayssa-portal-height",
            height
          },
          "*"
        );
      });
    };

    new ResizeObserver(reportEmbeddedHeight)
      .observe(document.body);
    window.addEventListener("load", reportEmbeddedHeight);
  }

  loadMember();

</script>
