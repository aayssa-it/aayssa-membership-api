<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AAYSSA Calendar</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #2c211a;
      background: #f7f4ef;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .banner {
      padding: 28px 20px;
      background: linear-gradient(135deg, #4e1f08, #a45712);
      color: #fff;
      text-align: center;
    }
    .banner img {
      width: 95px;
      max-height: 95px;
      object-fit: contain;
    }
    .banner h1 {
      margin: 10px 0 5px;
      font-family: Georgia, serif;
      font-size: clamp(28px, 5vw, 44px);
    }
    .banner p { margin: 0; color: #ffe7bf; }
    main {
      width: min(1050px, calc(100% - 28px));
      margin: 24px auto 50px;
    }
    .calendar-card {
      padding: 22px;
      border: 1px solid #e4d8c8;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(67, 39, 13, .08);
    }
    .intro {
      margin: 0 0 16px;
      color: #5d554d;
      line-height: 1.55;
      text-align: center;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin: 16px 0;
      font-size: 13px;
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border-radius: 3px;
      background: var(--color);
      vertical-align: -1px;
    }
    .navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 12px;
    }
    .navigation strong {
      color: #713d0d;
      font-family: Georgia, serif;
      font-size: 22px;
      text-align: center;
    }
    button {
      padding: 9px 14px;
      border: 1px solid #b97716;
      border-radius: 8px;
      background: #fffaf2;
      color: #713d0d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { border-color: #ddd; color: #aaa; cursor: default; }
    .calendar-scroll { overflow-x: auto; }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(88px, 1fr));
      gap: 6px;
      min-width: 690px;
    }
    .weekday {
      padding: 7px;
      color: #716b63;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .day {
      min-height: 88px;
      padding: 8px 5px;
      border: 1px solid #eee9e2;
      border-radius: 8px;
      color: #aaa49c;
      text-align: center;
    }
    .day strong, .day small { display: block; }
    .day small { margin-top: 7px; font-size: 11px; line-height: 1.3; }
    .day.available { border-color: #b9dbc3; background: #e9f6ed; color: #1f6834; }
    .day.booked { border-color: #e3b95e; background: #fff0c9; color: #704300; }
    .day.blocked { border-color: #d5d1cc; background: #ece9e5; color: #6f6962; }
    .rsvp-button { margin-top: 8px; padding: 6px 10px; font-size: 12px; }
    .rsvp-count { color: #5d3a08; font-weight: 700; }
    .message { padding: 30px; color: #666; text-align: center; }
    .message.error { color: #a32626; }
    dialog { width: min(520px, calc(100% - 24px)); border: 0; border-radius: 14px; padding: 0; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
    dialog::backdrop { background: rgba(34, 22, 12, .58); }
    .rsvp-form { padding: 22px; }
    .rsvp-form h2 { margin: 0 0 5px; color: #713d0d; }
    .rsvp-form p { margin: 0 0 16px; color: #625950; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .form-grid label { display: grid; gap: 5px; font-size: 13px; font-weight: 700; }
    .form-grid .full { grid-column: 1 / -1; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cfc4b8; border-radius: 7px; font: inherit; }
    textarea { min-height: 80px; resize: vertical; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 17px; }
    .form-message { margin-top: 12px; font-size: 14px; }
    .form-message.error { color: #a32626; }
    @media (max-width: 600px) {
      main { width: min(100% - 18px, 1050px); margin-top: 12px; }
      .calendar-card { padding: 14px; }
      .navigation strong { font-size: 18px; }
      button { padding: 8px 10px; font-size: 13px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="banner">
    <img src="https://img1.wsimg.com/isteam/ip/e97baa43-87af-41b2-a556-36e5f7165670/blob-1444af7.png" alt="AAYSSA">
    <h1>AAYSSA Calendar</h1>
    <p>Atlanta Ayyappa Seva Sangam</p>
  </header>
  <main>
    <section class="calendar-card">
      <p class="intro">
        View current Home Pooja availability. Members may sign in to the
        AAYSSA Member Portal to reserve an available date.
      </p>
      <div class="legend">
        <span style="--color:#e9f6ed">Available</span>
        <span style="--color:#fff0c9">Booked</span>
        <span style="--color:#ece9e5">AAYSSA Event</span>
      </div>
      <div id="calendar" class="message">Loading calendar…</div>
    </section>
  </main>
  <dialog id="rsvpDialog">
    <form id="rsvpForm" class="rsvp-form">
      <h2 id="rsvpDialogTitle">New RSVP</h2>
      <p id="rsvpEvent"></p>
      <input type="hidden" name="bookingReference">
      <input type="text" name="website" tabindex="-1" autocomplete="off" hidden>
      <div class="form-grid">
        <label class="full">Attendee Name *<input name="attendeeName" maxlength="150" required></label>
        <label>Email *<input name="email" type="email" maxlength="254" required></label>
        <label>Phone<input name="phone" type="tel" maxlength="100"></label>
        <label>RSVP Status *
          <select name="status" required>
            <option value="Attending">Attending</option>
            <option value="Maybe">Maybe</option>
            <option value="Not Attending">Not Attending</option>
          </select>
        </label>
        <label>Number of Adults *<input name="adults" type="number" min="0" step="1" value="1" required></label>
        <label>Number of Kids *<input name="kids" type="number" min="0" step="1" value="0" required></label>
        <label class="full">Notes<textarea name="notes" maxlength="2000"></textarea></label>
      </div>
      <div id="rsvpMessage" class="form-message" role="status"></div>
      <div class="form-actions">
        <button type="button" id="cancelRsvp">Cancel</button>
        <button type="submit" id="submitRsvp">Submit RSVP</button>
      </div>
    </form>
  </dialog>
  <dialog id="editRsvpDialog">
    <form id="editRsvpForm" class="rsvp-form">
      <h2 id="editRsvpDialogTitle">Edit RSVP</h2>
      <p id="editRsvpEvent"></p>
      <input type="hidden" name="bookingReference">
      <div id="editRsvpLookup" class="form-grid">
        <label class="full">Email Used for RSVP *
          <input name="email" type="email" maxlength="254" required>
        </label>
        <div class="form-actions full">
          <button type="button" id="sendEditCode">Send Verification Code</button>
        </div>
      </div>
      <div id="editRsvpVerification" class="form-grid" hidden>
        <label class="full">Email Verification Code *
          <input name="verificationCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
        </label>
        <div class="form-actions full">
          <button type="button" id="verifyEditRsvp">Verify and Load RSVP</button>
        </div>
      </div>
      <div id="editRsvpFields" class="form-grid" hidden>
        <label class="full">Attendee Name *<input name="attendeeName" maxlength="150"></label>
        <label>Phone<input name="phone" type="tel" maxlength="100"></label>
        <label>RSVP Status *
          <select name="status">
            <option value="Attending">Attending</option>
            <option value="Maybe">Maybe</option>
            <option value="Not Attending">Not Attending</option>
          </select>
        </label>
        <label>Number of Adults *<input name="adults" type="number" min="0" step="1"></label>
        <label>Number of Kids *<input name="kids" type="number" min="0" step="1"></label>
        <label class="full">Notes<textarea name="notes" maxlength="2000"></textarea></label>
      </div>
      <div id="editRsvpMessage" class="form-message" role="status"></div>
      <div class="form-actions">
        <button type="button" id="cancelEditRsvp">Cancel</button>
        <button type="submit" id="updateRsvp" hidden>Update RSVP</button>
      </div>
    </form>
  </dialog>
  <script>
    const calendar = document.getElementById("calendar");
    const rsvpDialog = document.getElementById("rsvpDialog");
    const rsvpForm = document.getElementById("rsvpForm");
    const editRsvpDialog = document.getElementById("editRsvpDialog");
    const editRsvpForm = document.getElementById("editRsvpForm");
    let dates = [];
    let monthKeys = [];
    let currentMonthIndex = 0;
    let rsvpEditToken = "";

    loadCalendar();

    async function loadCalendar() {
      try {
        const response = await fetch("/api/register?resource=home-pooja");
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.message || "Unable to load the calendar.");
        }
        dates = Array.isArray(data.calendar?.dates) ? data.calendar.dates : [];
        monthKeys = [...new Set(dates.map(item => item.date.slice(0, 7)))];
        if (!monthKeys.length) {
          calendar.className = "message";
          calendar.textContent = "No Home Pooja dates are currently published.";
          return;
        }
        const sharedParams = new URLSearchParams(window.location.search);
        const sharedReference = sharedParams.get("rsvp");
        const sharedDate = sharedParams.get("date");
        const sharedItem = sharedReference || sharedDate
          ? dates.find(item =>
              String(item.bookingId || item.eventReference || "") === sharedReference ||
              item.date === sharedDate
            )
          : null;
        const sharedMonthIndex = sharedItem
          ? monthKeys.indexOf(sharedItem.date.slice(0, 7))
          : -1;

        currentMonthIndex = sharedMonthIndex >= 0 ? sharedMonthIndex : 0;
        renderCalendar();

        if (sharedItem) {
          const resolvedReference = String(
            sharedItem.bookingId || sharedItem.eventReference || ""
          );
          const newRsvpButton = [...calendar.querySelectorAll('[data-rsvp-action="new"]')]
            .find(button =>
              button.dataset.rsvpReference === resolvedReference ||
              button.dataset.rsvpDate === sharedItem.date
            );
          if (newRsvpButton) {
            openRsvp(newRsvpButton);
          }
        }
      } catch (error) {
        calendar.className = "message error";
        calendar.textContent = error.message;
      }
    }

    function renderCalendar() {
      const monthKey = monthKeys[currentMonthIndex];
      const [year, month] = monthKey.split("-").map(Number);
      const dateMap = new Map(dates.map(item => [item.date, item]));
      const firstDay = new Date(year, month - 1, 1);
      const daysInMonth = new Date(year, month, 0).getDate();
      const cells = [];

      for (let index = 0; index < firstDay.getDay(); index += 1) {
        cells.push('<div class="day" aria-hidden="true"></div>');
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const item = dateMap.get(date);
        const status = item?.status || "";
        const statusClass = status.toLowerCase();
        const detail = status === "Booked"
          ? [
              "Booked",
              item.requesterName,
              item.bookingTime,
              item.poojaAddress
            ].filter(Boolean).join(" · ")
          : status === "Blocked"
            ? `AAYSSA Event${item.reason ? ` · ${item.reason}` : ""}`
            : status === "Available"
              ? item.time
              : "";
        const rsvpReference = item?.bookingId
          ? String(item.bookingId)
          : item?.eventReference || "";
        const rsvpLabel = status === "Blocked"
          ? item?.eventName || item?.reason || "AAYSSA Event"
          : item?.requesterName || "Home Pooja";
        const rsvpTitle = status === "Blocked"
          ? "AAYSSA Event RSVP"
          : `${rsvpLabel} Home Pooja RSVP`;
        const rsvpButton = rsvpReference
          ? `<button type="button" class="rsvp-button" data-rsvp-action="new" data-rsvp-reference="${escapeHtml(rsvpReference)}" data-rsvp-date="${date}" data-rsvp-title="${escapeHtml(rsvpTitle)}" data-event="${escapeHtml(`${date} · ${rsvpLabel}`)}">New RSVP</button>
             <button type="button" class="rsvp-button" data-rsvp-action="edit" data-rsvp-reference="${escapeHtml(rsvpReference)}" data-rsvp-date="${date}" data-rsvp-title="${escapeHtml(rsvpTitle)}" data-event="${escapeHtml(`${date} · ${rsvpLabel}`)}">Edit RSVP</button>
             <button type="button" class="rsvp-button" data-rsvp-action="share" data-rsvp-reference="${escapeHtml(rsvpReference)}" data-rsvp-date="${date}" data-rsvp-title="${escapeHtml(rsvpTitle)}" data-event="${escapeHtml(`${date} · ${rsvpLabel}`)}">Share RSVP</button>`
          : "";
        const rsvpSummary = (status === "Booked" || status === "Blocked") && item.rsvpSummary
          ? `<small class="rsvp-count">${Number(item.rsvpSummary.attendingGuests) || 0} attending${item.rsvpSummary.maybeGuests ? ` · ${Number(item.rsvpSummary.maybeGuests)} maybe` : ""}</small>`
          : "";
        cells.push(`
          <div class="day ${escapeHtml(statusClass)}">
            <strong>${day}</strong>
            ${detail ? `<small>${escapeHtml(detail)}</small>` : ""}
            ${rsvpSummary}
            ${rsvpButton}
          </div>
        `);
      }

      const label = new Intl.DateTimeFormat("en-US", {
        month: "long",
        year: "numeric"
      }).format(new Date(year, month - 1, 1));

      calendar.className = "";
      calendar.innerHTML = `
        <div class="navigation">
          <button type="button" id="previousMonth" ${currentMonthIndex === 0 ? "disabled" : ""}>← Previous</button>
          <strong>${escapeHtml(label)}</strong>
          <button type="button" id="nextMonth" ${currentMonthIndex === monthKeys.length - 1 ? "disabled" : ""}>Next →</button>
        </div>
        <div class="calendar-scroll">
          <div class="calendar-grid">
            ${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(day => `<div class="weekday">${day}</div>`).join("")}
            ${cells.join("")}
          </div>
        </div>
      `;
      document.getElementById("previousMonth").addEventListener("click", () => {
        currentMonthIndex -= 1;
        renderCalendar();
      });
      document.getElementById("nextMonth").addEventListener("click", () => {
        currentMonthIndex += 1;
        renderCalendar();
      });
      calendar.querySelectorAll("[data-rsvp-reference]").forEach(button => {
        button.addEventListener("click", async () => {
          if (button.dataset.rsvpAction === "edit") {
            openEditRsvp(button);
          } else if (button.dataset.rsvpAction === "share") {
            await shareRsvp(button);
          } else {
            openRsvp(button);
          }
        });
      });
    }

    async function shareRsvp(button) {
      const url = new URL(window.location.pathname, window.location.origin);
      url.searchParams.set("rsvp", button.dataset.rsvpReference);
      if (button.dataset.rsvpDate) {
        url.searchParams.set("date", button.dataset.rsvpDate);
      }
      const shareData = {
        title: "AAYSSA Home Pooja RSVP",
        text: `Please RSVP for ${button.dataset.event}.`,
        url: url.toString()
      };
      const originalLabel = button.textContent;

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          button.textContent = "Shared";
        } catch (error) {
          if (error?.name === "AbortError") return;
          await copyRsvpLink(button, url.toString());
          return;
        }
      } else {
        await copyRsvpLink(button, url.toString());
        return;
      }

      window.setTimeout(() => {
        button.textContent = originalLabel;
      }, 2500);
    }

    async function copyRsvpLink(button, url) {
      const originalLabel = button.textContent;

      try {
        await navigator.clipboard.writeText(url);
        button.textContent = "Link Copied";
        window.setTimeout(() => {
          button.textContent = originalLabel;
        }, 2500);
      } catch (error) {
        window.prompt("Copy this RSVP link:", url);
      }
    }

    function openRsvp(button) {
      rsvpForm.reset();
      rsvpForm.elements.bookingReference.value = button.dataset.rsvpReference;
      rsvpForm.elements.adults.value = "1";
      rsvpForm.elements.kids.value = "0";
      document.getElementById("rsvpDialogTitle").textContent =
        button.dataset.rsvpTitle || "New RSVP";
      document.getElementById("rsvpEvent").textContent = button.dataset.event;
      document.getElementById("rsvpMessage").textContent = "";
      rsvpDialog.showModal();
    }

    function openEditRsvp(button) {
      editRsvpForm.reset();
      resetEditRsvpDialog();
      editRsvpForm.elements.bookingReference.value = button.dataset.rsvpReference;
      document.getElementById("editRsvpDialogTitle").textContent =
        `Edit ${button.dataset.rsvpTitle || "RSVP"}`;
      document.getElementById("editRsvpEvent").textContent = button.dataset.event;
      editRsvpDialog.showModal();
    }

    document.getElementById("cancelRsvp").addEventListener("click", () => rsvpDialog.close());
    document.getElementById("cancelEditRsvp").addEventListener("click", () => editRsvpDialog.close());

    document.getElementById("sendEditCode").addEventListener("click", async () => {
      const emailInput = editRsvpForm.elements.email;
      if (!emailInput.reportValidity()) return;
      const button = document.getElementById("sendEditCode");
      const message = document.getElementById("editRsvpMessage");
      button.disabled = true;
      message.className = "form-message";
      message.textContent = "Sending verification code…";
      try {
        const data = await postRsvpAction({
          action: "request-edit-code",
          bookingReference: editRsvpForm.elements.bookingReference.value,
          email: emailInput.value
        });
        document.getElementById("editRsvpVerification").hidden = false;
        editRsvpForm.elements.verificationCode.required = true;
        editRsvpForm.elements.verificationCode.focus();
        message.textContent = data.message;
      } catch (error) {
        message.className = "form-message error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("verifyEditRsvp").addEventListener("click", async () => {
      const codeInput = editRsvpForm.elements.verificationCode;
      if (!codeInput.reportValidity()) return;
      const button = document.getElementById("verifyEditRsvp");
      const message = document.getElementById("editRsvpMessage");
      button.disabled = true;
      message.className = "form-message";
      message.textContent = "Verifying…";
      try {
        const data = await postRsvpAction({
          action: "verify-edit-code",
          bookingReference: editRsvpForm.elements.bookingReference.value,
          email: editRsvpForm.elements.email.value,
          code: codeInput.value
        });
        const existing = data.rsvp;
        rsvpEditToken = data.editToken;
        editRsvpForm.elements.attendeeName.value = existing.attendeeName || "";
        editRsvpForm.elements.email.value = existing.email || "";
        editRsvpForm.elements.email.readOnly = true;
        editRsvpForm.elements.phone.value = existing.phone || "";
        editRsvpForm.elements.status.value = existing.status || "Attending";
        editRsvpForm.elements.adults.value = existing.adults ?? 0;
        editRsvpForm.elements.kids.value = existing.kids ?? 0;
        editRsvpForm.elements.notes.value = existing.notes || "";
        editRsvpForm.elements.attendeeName.required = true;
        editRsvpForm.elements.status.required = true;
        editRsvpForm.elements.adults.required = true;
        editRsvpForm.elements.kids.required = true;
        document.getElementById("editRsvpLookup").hidden = true;
        document.getElementById("editRsvpVerification").hidden = true;
        document.getElementById("editRsvpFields").hidden = false;
        codeInput.required = false;
        document.getElementById("updateRsvp").hidden = false;
        message.textContent = "Your RSVP is ready to edit.";
      } catch (error) {
        message.className = "form-message error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    rsvpForm.addEventListener("submit", async event => {
      event.preventDefault();
      const submitButton = document.getElementById("submitRsvp");
      const message = document.getElementById("rsvpMessage");
      const values = Object.fromEntries(new FormData(rsvpForm));
      values.action = "submit";
      values.adults = Number(values.adults);
      values.kids = Number(values.kids);
      submitButton.disabled = true;
      message.className = "form-message";
      message.textContent = "Submitting…";

      try {
        const data = await postRsvpAction(values);
        rsvpForm.reset();
        message.textContent = data.message;
        setTimeout(() => rsvpDialog.close(), 1400);
      } catch (error) {
        message.className = "form-message error";
        message.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    editRsvpForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (!rsvpEditToken) return;
      const submitButton = document.getElementById("updateRsvp");
      const message = document.getElementById("editRsvpMessage");
      const values = Object.fromEntries(new FormData(editRsvpForm));
      values.action = "update";
      values.editToken = rsvpEditToken;
      values.adults = Number(values.adults);
      values.kids = Number(values.kids);
      submitButton.disabled = true;
      message.className = "form-message";
      message.textContent = "Updating…";
      try {
        const data = await postRsvpAction(values);
        message.textContent = data.message;
        setTimeout(() => editRsvpDialog.close(), 1400);
      } catch (error) {
        message.className = "form-message error";
        message.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    async function postRsvpAction(values) {
      const response = await fetch("/api/register?resource=rsvp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(values)
      });
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || "Unable to process your RSVP.");
      }
      return data;
    }

    function resetEditRsvpDialog() {
      rsvpEditToken = "";
      editRsvpForm.elements.email.readOnly = false;
      editRsvpForm.elements.verificationCode.required = false;
      editRsvpForm.elements.attendeeName.required = false;
      editRsvpForm.elements.status.required = false;
      editRsvpForm.elements.adults.required = false;
      editRsvpForm.elements.kids.required = false;
      document.getElementById("editRsvpLookup").hidden = false;
      document.getElementById("editRsvpVerification").hidden = true;
      document.getElementById("editRsvpFields").hidden = true;
      document.getElementById("updateRsvp").hidden = true;
      document.getElementById("editRsvpMessage").textContent = "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
